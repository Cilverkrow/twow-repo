# Quest feasibility catalog (twow-repo#601 R08a, OB-00 decisions 2026-10-19): the ONLY hand-edited input.
# `python3 -m dbcheck catalog generate` renders quest-feasibility.tsv and quest-feasibility.keys from it; the CI lint checks
# that both are up to date and that the two key lines in config/canonical/profiles/funserver-test/aiplayerbot.overlay.conf
# equal the rendered .keys; the integration job checks every `basis = "rule"` quest against the core-pin world
# (`dbcheck catalog check --disposable`).
#
# basis = "rule": the quest must still match `rule` (facts.toml) on the world data, else CI fails - the reason is gone
#                 (e.g. the taker got its spawn) and the id should leave the list.
# basis = "override": a reason the data cannot show (escort/event scripts, spell or item use, config-dependent legs);
#                 CI only checks that the quest exists.
# class: impossible | needs_group (S7 group help; owner decision 2026-10-18; a rule-based entry uses GROUP_HELP = the S7 scope, so dungeon /
#        raid quests are impossible for solo bots, CLI-Deep 25.10.) | config (only while CustomRaceStartZones = 0).
# Freeze (OB-00 2026-10-19): an id outside [catalog].frozen_baseline needs `approved = "OB-00 YYYY-MM-DD <link>"`.

