# Tower of Karazhan (raid, 40 players, map 814): the nine bosses in the order the
# wiki gives, with their loot. Item names and NPC entries only (no text from the
# source). The chess pieces share the King's loot; the Knight, Rook and Bishop
# have no loot of their own.

[instance]
id = "tower-of-karazhan"
name = "Tower of Karazhan"
source = "https://turtle-wow.fandom.com/wiki/Tower_of_Karazhan (boss pages of the nine bosses; CC-BY-SA, used as a reference only)"
source_date = "2026-09-29"
maps = [814]
# Ephemeral Pendant is a shared drop of the later bosses and the chess event.
allow_elsewhere = ["Ephemeral Pendant"]

