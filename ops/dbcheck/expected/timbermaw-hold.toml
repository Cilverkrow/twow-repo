# Timbermaw Hold (raid, map 819): a snapshot of OUR data, taken 2026-09-29 from
# tw_world v16 and the OB-20 review of #438. It is NOT an external source: the
# wiki page for the raid is a stub. Use it as regression protection (a change
# that drops a boss, a token or a quest is caught), not as proof that the raid is
# right. The three deviations below are known and decided (owner, variant A,
# train 9); the tool reports them until they are fixed:
#   Ursol (62947) and Peroth'arn (60686) have no spawn; Selenaxx (62940) has rank 0.
# Loktanag the Vile uses the old low id 2139; the boots token belongs to him.
# Karrsh the Sentinel (62934) is the first boss per the wiki; the database has him at rank 0.

[instance]
id = "timbermaw-hold"
name = "Timbermaw Hold"
source = "tw_world v16 snapshot 2026-09-29 (OB-40 disposable copy), boss table from OB-20 review of twow-repo#438"
