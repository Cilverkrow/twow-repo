# Bosses that C++ or a spell summons in ways tools/scan_summons.py cannot see (a
# form change, a spell that carries the entry, a table of guards). Entered by
# hand, each with its source in twow-core main @ acc8dec0. Confirmed by OB-20
# (#408, 2026-09-29). Add a line only with a file, a line and what happens there.

[instance]
id = "cpp-summoned-bosses-manual"
name = "Bosses that C++ or a spell summons (by hand)"
source = "twow-core main acc8dec0, src/scripts and src/game; spell_template 26061 in tw_world v16"
source_date = "2026-09-29"

# Thekal: the spawned High Priest Thekal (14599) changes into this entry in the
# second phase.
[[summoned_boss]]
entry = 14509
via = "cpp"
note = "High Priest Thekal: src/scripts/dungeons/zulgurub/boss_thekal.cpp:358 (SetEntry)"

