# Rules that compare the world database with what the game client can show (#455 A10).
# The client numbers come from rules/client-facts.toml, generated by
# `python -m clientinventory facts` (ids and tile numbers only, no client content).
# Regenerate that file when the client changes; the rules stay as they are.
#
# Tile id = x*1000 + y, x from the world Y axis, y from the world X axis:
#   x = floor(32 - position_y/533.33333), y = floor(32 - position_x/533.33333).
# Spawns switched off with SPAWN_FLAG_DISABLED (spawn_flags bit 2, value 2) are skipped: `flags % 4 < 2` tests
# that bit without bitwise operators, so the SQL runs on SQLite as well.
# ROUND(v - 0.5) is used for floor() so the SQL runs on MariaDB and SQLite alike.

[rule.gameobject_spawn_display_unknown_to_client]
scope = "global"
severity = "warn"
title = "Spawned game objects whose display id the client does not know"
description = "The client shows no model for them (invisible or placeholder). Display ids come from the client's GameObjectDisplayInfo.dbc (rules/client-facts.toml). Templates that are not spawned are not listed; see twow-repo#455."
sql = """
SELECT t.{gameobject_template.entry} AS object_entry, t.{gameobject_template.name} AS object_name,
       t.{gameobject_template.display_id} AS display_id, COUNT(*) AS spawns
FROM {gameobject} g
JOIN {gameobject_template} t ON t.{gameobject_template.entry} = g.{gameobject.id}
WHERE t.{gameobject_template.display_id} > 0
  AND (COALESCE(g.{gameobject.spawn_flags}, 0) % 4) < 2
  AND NOT ( {%go_display_known} )
GROUP BY t.{gameobject_template.entry}, t.{gameobject_template.name}, t.{gameobject_template.display_id}
ORDER BY spawns DESC
"""

[rule.creature_spawn_on_tile_without_client_terrain]
scope = "global"
severity = "warn"
title = "Creature spawns on Eastern Kingdoms / Kalimdor tiles without client terrain"
description = "The client has no ground on that tile, so the creature stands in the void. Tiles come from the client's map files (rules/client-facts.toml, maps 0 and 1 only)."
sql = """
SELECT s.mapid AS map_id, s.tid AS tile_id, COUNT(*) AS spawns
FROM (
  SELECT c.{creature.map} AS mapid,
         ROUND(32 - c.{creature.position_y} / 533.33333 - 0.5) * 1000 + ROUND(32 - c.{creature.position_x} / 533.33333 - 0.5) AS tid
  FROM {creature} c
  WHERE c.{creature.map} IN (0, 1)
    AND (COALESCE(c.{creature.spawn_flags}, 0) % 4) < 2
) s
WHERE (s.mapid = 0 AND NOT ( {%client_tiles_map0} ))
   OR (s.mapid = 1 AND NOT ( {%client_tiles_map1} ))
GROUP BY s.mapid, s.tid
ORDER BY spawns DESC
"""

[rule.gameobject_spawn_on_tile_without_client_terrain]
scope = "global"
severity = "warn"
title = "Game object spawns on Eastern Kingdoms / Kalimdor tiles without client terrain"
description = "Same check as for creatures, for game object spawns."
sql = """
SELECT s.mapid AS map_id, s.tid AS tile_id, COUNT(*) AS spawns
FROM (
  SELECT g.{gameobject.map} AS mapid,
         ROUND(32 - g.{gameobject.position_y} / 533.33333 - 0.5) * 1000 + ROUND(32 - g.{gameobject.position_x} / 533.33333 - 0.5) AS tid
  FROM {gameobject} g
  WHERE g.{gameobject.map} IN (0, 1)
    AND (COALESCE(g.{gameobject.spawn_flags}, 0) % 4) < 2
) s
WHERE (s.mapid = 0 AND NOT ( {%client_tiles_map0} ))
   OR (s.mapid = 1 AND NOT ( {%client_tiles_map1} ))
GROUP BY s.mapid, s.tid
ORDER BY spawns DESC
"""
