# Talent rank spells and prerequisites of rows we change must exist on the
# server (stage 2: bot auras 90100-90199 become rank spells).
[[rule]]
id = "talent-ranks-on-server"
kind = "refs_in_sql"
source = "spell_template"
dbc = "Talent"
scope = "changed"
columns = ["SpellRank[0]", "SpellRank[1]", "SpellRank[2]", "SpellRank[3]", "SpellRank[4]", "SpellRank[5]", "SpellRank[6]", "SpellRank[7]", "SpellRank[8]", "RequiredSpellID"]
why = "a talent rank the server does not know cannot be learned"

# Every Spell.dbc row we change must mirror the server's spell_template in
