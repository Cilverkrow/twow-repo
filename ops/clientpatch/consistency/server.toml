# Consistency rules: client DBC content vs server SQL (design 3.4 step 2 b).
# A finding that is not accepted fails the build. Accept a known difference
# only with a reason and an issue reference; stale accepts are reported.
# Add a pairing by adding a rule - no code change (tooling principle 1).

# Every server map needs a client Map.dbc row, or the client hangs on the
# loading screen (#408).
[[rule]]
id = "map-in-client"
kind = "keys_in_dbc"
source = "map_template"
dbc = "Map"
why = "#408: a server-only map hangs the client"

[[rule.accept]]
key = "45"
reason = "#408/#412/#425: Citadel map 45 is server-only until the client patch adds its Map.dbc row"

# Area triggers only fire when the client knows them, and their map must agree.
[[rule]]
id = "areatrigger-in-client"
kind = "keys_in_dbc"
source = "areatrigger_template"
dbc = "AreaTrigger"
why = "a server trigger the client does not know never fires"

[[rule]]
id = "areatrigger-map-position"
kind = "fields_equal"
source = "areatrigger_template"
dbc = "AreaTrigger"
scope = "all"
why = "#408: trigger 5340 had map 0 in the DB while its entrance is on map 532"

[[rule.pair]]
sql = "map_id"
dbc = "ContinentID"

[[rule.pair]]
sql = "x"
dbc = "Pos[0]"
tolerance = 1.0

[[rule.pair]]
sql = "y"
dbc = "Pos[1]"
tolerance = 1.0

[[rule.pair]]
sql = "z"
dbc = "Pos[2]"
tolerance = 1.0

[[rule.accept]]
key = "5340"
reason = "#408: DB row has map 0, entrance is on map 532 (reported; remove this accept once fixed)"

# skill_race_class_info_mod overrides SkillRaceClassInfo.dbc on the server
# (SpellMgr.cpp:2676-2733, -1 = keep the DBC value). The client DBC must match
# functionally, and new rows need a client row (#379, #392 weapon talent W).
[[rule]]
id = "skillraceclass-mod-in-client"
kind = "keys_in_dbc"
source = "skill_race_class_info_mod"
dbc = "SkillRaceClassInfo"
why = "a server-only skill access row is invisible in the client"

[[rule]]
id = "skillraceclass-mod-values"
kind = "fields_equal"
source = "skill_race_class_info_mod"
dbc = "SkillRaceClassInfo"
scope = "all"
skip_sql_value = "-1"
why = "server override and client DBC must agree"

[[rule.pair]]
sql = "SkillLineDbcRecord"
dbc = "SkillID"

[[rule.pair]]
sql = "RaceMask"
dbc = "RaceMask"

[[rule.pair]]
sql = "ClassMask"
dbc = "ClassMask"

[[rule.pair]]
sql = "Flags"
dbc = "Flags"

[[rule.pair]]
sql = "MinLevel"
dbc = "MinLevel"

[[rule.pair]]
sql = "SkillTierId"
dbc = "SkillTierID"

[[rule.pair]]
sql = "SkillCostIndex"
dbc = "SkillCostIndex"

# Talent rank spells and prerequisites of rows we change must exist on the
# server (stage 2: bot auras 90100-90199 become rank spells).
[[rule]]
id = "talent-ranks-on-server"
kind = "refs_in_sql"
source = "spell_template"
dbc = "Talent"
scope = "changed"
columns = ["SpellRank[0]", "SpellRank[1]", "SpellRank[2]", "SpellRank[3]", "SpellRank[4]", "SpellRank[5]", "SpellRank[6]", "SpellRank[7]", "SpellRank[8]", "RequiredSpellID"]
why = "a talent rank the server does not know cannot be learned"

# Every Spell.dbc row we change must mirror the server's spell_template in
# every field the client uses for tooltips and cast prediction (design 2.3).
# Code-side values (changes/code-values.md) are not in spell_template.
[[rule]]
id = "spell-matches-server"
kind = "fields_equal"
source = "spell_template"
dbc = "Spell"
scope = "changed"
why = "tooltip numbers and client cast prediction come from the client Spell.dbc"

