# Consistency rules: client DBC content vs server SQL (design 3.4 step 2 b).
# A finding that is not accepted fails the build. Accept a known difference
# only with a reason and an issue reference; stale accepts are reported.
# Add a pairing by adding a rule - no code change (tooling principle 1).

# Every reachable server map needs a client Map.dbc row, or the client hangs
# on the loading screen (#408). "Reachable" = spawns, a teleport target or a
# .tele entry (source map_in_use); empty test/dev maps in map_template are
# ignored (OB-20 review: 13, 25, 29, 31, 37, 42, 44, 49, 50, 150, 804, 806, 809).
[[rule]]
id = "map-in-client"
kind = "keys_in_dbc"
source = "map_in_use"
dbc = "Map"
why = "#408: a reachable server-only map hangs the client"

[[rule.accept]]
key = "45"
reason = "#408/#412/#425: Citadel map 45 is server-only until the client patch adds its Map.dbc row"

# Area triggers only fire when the client knows them, and their map must agree.
[[rule]]
id = "areatrigger-in-client"
kind = "keys_in_dbc"
source = "areatrigger_template"
dbc = "AreaTrigger"
why = "a server trigger the client does not know never fires"

[[rule]]
id = "areatrigger-map-position"
kind = "fields_equal"
source = "areatrigger_template"
dbc = "AreaTrigger"
scope = "all"
why = "a trigger on a different map in client and server never fires where the server expects it"

[[rule.pair]]
sql = "map_id"
dbc = "ContinentID"

[[rule.pair]]
sql = "x"
dbc = "Pos[0]"
tolerance = 1.0

[[rule.pair]]
sql = "y"
dbc = "Pos[1]"
tolerance = 1.0

[[rule.pair]]
sql = "z"
dbc = "Pos[2]"
tolerance = 1.0

# No accept for 5340: OB-20 checked all 517 rows against the client (#431
# review) - client and server agree (5340 is on map 0 in both). The open
# #408 question about 5340 is content, not client/server drift.

# skill_race_class_info_mod overrides SkillRaceClassInfo.dbc on the server
# (SpellMgr.cpp:2676-2733, -1 = keep the DBC value). The client DBC must match
# functionally, and new rows need a client row (#379, #392 weapon talent W).
[[rule]]
id = "skillraceclass-mod-in-client"
kind = "keys_in_dbc"
source = "skill_race_class_info_mod"
dbc = "SkillRaceClassInfo"
why = "a server-only skill access row is invisible in the client"

[[rule]]
id = "skillraceclass-mod-values"
kind = "fields_equal"
source = "skill_race_class_info_mod"
dbc = "SkillRaceClassInfo"
scope = "all"
skip_sql_value = "-1"
why = "server override and client DBC must agree"

[[rule.pair]]
sql = "SkillLineDbcRecord"
dbc = "SkillID"

[[rule.pair]]
