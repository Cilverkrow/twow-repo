# Canonical non-secret Compose semantics for aiplayerbot.conf.
# KEEP values preserve the verified sanitized project baseline.
AiPlayerbot.Enabled = 1
AiPlayerbot.MinRandomBots = @AIPLAYERBOT_MIN_BOTS@
AiPlayerbot.MaxRandomBots = @AIPLAYERBOT_MAX_BOTS@
AiPlayerbot.AutoLearnDroppedSpells = 1
