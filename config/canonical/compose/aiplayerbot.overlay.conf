# Canonical non-secret Compose semantics for aiplayerbot.conf.
# KEEP values preserve the verified sanitized project baseline.
AiPlayerbot.Enabled = 1
# The event store lives in its own schema here. Core defaults this key to the
# unqualified ai_playerbot_random_bots (the upstream default); this deployment
# keeps it in cv_bots, which deploy/compose/db-init.sh creates and grants on.
#
# Inert today -- the platform's copy of mod-playerbots hardcodes the same value
# in a constexpr and never reads this key. It is set NOW, ahead of the module
# flip (#203), precisely because after the flip core reads the config and this
# key becomes the only thing standing between the deployment and a silent
# repoint to the legacy table in tw_char. Landing it with the flip would make
# one commit responsible for both halves of that.
AiPlayerbot.EventStoreTable = `cv_bots`.`ai_playerbot_random_bots`
AiPlayerbot.MinRandomBots = @AIPLAYERBOT_MIN_BOTS@
AiPlayerbot.MaxRandomBots = @AIPLAYERBOT_MAX_BOTS@
AiPlayerbot.AutoLearnDroppedSpells = 1
AiPlayerbot.AutoLearnQuestSpells = 1
AiPlayerbot.BoostFollow = 1
AiPlayerbot.DisableBotOptimizations = 1
AiPlayerbot.DisableRandomLevels = 1
AiPlayerbot.GlobalSoundEffects = 1
AiPlayerbot.GuildRepliesRate = 65         # Reply someone saying something.
AiPlayerbot.LLMApiEndpoint = http://127.0.0.1:11434/v1/chat/completions
AiPlayerbot.LLMApiJson = {"model":"qwen2.5:7b","messages":[{"role":"user","content":"<prompt>"}],"stream":false,"temperature":0,"max_tokens":32}
AiPlayerbot.LLMBotToBotChatChance = 0
AiPlayerbot.LLMContextLength = 4096
AiPlayerbot.LLMEnabled = 0
AiPlayerbot.LLMGenerationTimeout = 30
AiPlayerbot.LLMMaxSimultaniousGenerations = 1
AiPlayerbot.LLMRpgAIChatChance = 0
AiPlayerbot.RandomBotFormGuild = 1
AiPlayerbot.RandomBotGroupNearby = 1
AiPlayerbot.RandomBotGuildCount = 12
AiPlayerbot.RandomBotGuildNearby = 1
AiPlayerbot.RandomBotInvitePlayer = 0
AiPlayerbot.RandomBotMaxLevelChance = 0
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotRaidNearby = 1
AiPlayerbot.SyncLevelMaxAbove = 4
AiPlayerbot.SyncLevelNoPlayer = 1
AiPlayerbot.SyncLevelWithPlayers = 1
AiPlayerbot.SyncQuestWithPlayer = 1
AiPlayerbot.ThunderfuryRepliesChance = 15
AiPlayerbot.ToxicLinksRepliesChance = 5
AiPlayerbot.TurnInRpg = 1
AiPlayerbot.UsePotionChance = 1.0
AiPlayerbot.XPRate = 0.8
