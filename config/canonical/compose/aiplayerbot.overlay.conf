AiPlayerbot.LLMBotToBotChatChance = 0
AiPlayerbot.LLMContextLength = 4096
AiPlayerbot.LLMEnabled = 0
AiPlayerbot.LLMGenerationTimeout = 30
AiPlayerbot.LLMMaxSimultaniousGenerations = 1
AiPlayerbot.LLMRpgAIChatChance = 0
AiPlayerbot.RandomBotFormGuild = 1
AiPlayerbot.RandomBotGroupNearby = 1
AiPlayerbot.RandomBotGuildCount = 12
AiPlayerbot.RandomBotGuildNearby = 1
AiPlayerbot.RandomBotInvitePlayer = 0
AiPlayerbot.RandomBotMaxLevelChance = 0
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotRaidNearby = 1
AiPlayerbot.SyncLevelMaxAbove = 4
AiPlayerbot.SyncLevelNoPlayer = 1
AiPlayerbot.SyncLevelWithPlayers = 1
AiPlayerbot.SyncQuestWithPlayer = 1
AiPlayerbot.ThunderfuryRepliesChance = 15
AiPlayerbot.ToxicLinksRepliesChance = 5
AiPlayerbot.TurnInRpg = 1
