# Canonical non-secret Compose semantics for mangosd.conf.
# KEEP values preserve the verified sanitized project baseline. Compose-only
# paths remain deliberate INTENTIONAL_CHANGE entries in semantic-baseline.tsv.

# Compose paths and fail-closed database policy.
DataDir = "/opt/turtle/data"
LogsDir = "/var/log/turtle"
HonorDir = "/var/log/turtle"
PDumpDir = "/var/log/turtle"
AiPlayerbot.ConfigFile = "/opt/turtle/etc/aiplayerbot.conf"
Database.AutoUpdate.Path = "/opt/turtle/sql/database_updates/"
Database.AutoUpdate.Enabled = 0
# Compose publishes the machine-local WORLD_PORT to this fixed container port.
WorldServerPort = 8090
LogSQL = 0
PidFile = "/tmp/twlive.pid"

# Verified server behaviour retained from the sanitized baseline.
AllFlightPaths = 1
BattleGround.Rate.Honor.AB = 2
BattleGround.Rate.Honor.AV = 2
BattleGround.Rate.Honor.SV = 2
BattleGround.Rate.Honor.WS = 2
BattleGround.Rate.Reputation.AB = 10
BattleGround.Rate.Reputation.AV = 10
BattleGround.Rate.Reputation.SV = 10
BattleGround.Rate.Reputation.WS = 10
Bones.ExpireMinutes = 15
Death.Ghost.RunSpeed.World = 2.0
GM.LoginState = 0
GM.StartLevel = 1
GM.StartOnGMIsland = 0
Rate.Drop.Item.Epic = 2
Rate.Drop.Item.Legendary = 2
Rate.Drop.Item.Rare = 2
Rate.Drop.Item.Uncommon = 3
Rate.Drop.Money = 2
Rate.Energy = 2.5
Rate.Focus = 2
Rate.Health = 2
Rate.Loyalty = 2
Rate.Mana = 2
Rate.Mining.Amount = 2
Rate.Mining.Next = 2
Rate.Rage.Income = 2
Rate.Reputation.Gain = 7
Rate.Reputation.LowLevel.Kill = 1
Rate.Reputation.LowLevel.Quest = 3
Rate.Rest.InGame = 2
Rate.Rest.Offline.InTavernOrCity = 2
Rate.Rest.Offline.InWilderness = 2
Rate.Skill.Discovery = 2
Rate.XP.Explore = 2
Rate.XP.Kill = 2
Rate.XP.Quest = 2
SkillChance.Green = 65
SkillChance.Grey = 25
SkillChance.Yellow = 85
SkillGain.Crafting = 3
