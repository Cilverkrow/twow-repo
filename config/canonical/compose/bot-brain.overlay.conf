# Canonical non-secret Compose semantics for modules/mod_bot_brain.conf.
#
# The complete base template is this repository's own
# modules/mod-bot-brain/conf/mod_bot_brain.conf.dist -- unlike the other three
# services, the module is ours, so the template is not in the core submodule.
#
# Nothing here is a secret: the module talks to a loopback/private planner and
# holds no credential. The file is rendered with provenance anyway, because a
# second, unverified mechanism for one config is a maintenance cost and the
# verifier is what stops a hand-edited runtime copy becoming authoritative.

# The switch. Off unless deploy/compose/.env sets BOT_BRAIN_ENABLE=1, so the
# stack still starts and plays with every project feature disabled (ADR-0024
# invariant 4). Before this file existed the key was reachable only by exec'ing
# into a running container: the conf was seeded inside the image from its .dist
# and no bind mount or render produced one.
BotBrain.Enable = @BOT_BRAIN_ENABLE@

# The template's 127.0.0.1 is the mangosd CONTAINER's loopback, where nothing
# listens; deploy/compose/bot-brain.yml publishes the service to the HOST's
# loopback. Both files declare `name: twow`, so when they are brought up
# together the planner is reachable from mangosd by its Compose service name on
# the project's default network. With bot-brain.yml absent this address simply
# does not resolve, which is the documented degraded path (stock travel
# chooser), not a startup failure.
BotBrain.Endpoint = "http://bot-brain:8085"
