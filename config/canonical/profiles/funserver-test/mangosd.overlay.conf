# XP 1/1/1 for the test phase: owner decision 2026-09-24 (#321, group B).
Rate.XP.Kill = 1
Rate.XP.Quest = 1
Rate.XP.Explore = 1
Rate.Talent = 2
# Train 9 (owner 2026-10-04, #482 round 2): one global rate set; legendary parts use the
# LegendaryPreset below and ignore the rates (was P1 N1 U1 R2 E5 L10, #528).
Rate.Drop.Item.Poor = 2
Rate.Drop.Item.Normal = 2
Rate.Drop.Item.Uncommon = 2
Rate.Drop.Item.Rare = 3
Rate.Drop.Item.Epic = 4
Rate.Drop.Item.Legendary = 1
Rate.Drop.Item.Artifact = 1
Rate.Drop.Item.Referenced = 1
Rate.Drop.Money = 3
# Bonus loot for admitted rares and registered bosses. SelectionMultiplier 8:
# owner decision 2026-09-24 (#321, group B); the mechanism is reworked in #323.
Funserver.Loot.Bonus.Enabled = 1
Funserver.Loot.Bonus.Rare = 1
Funserver.Loot.Bonus.RareElite = 1
Funserver.Loot.Bonus.WorldBoss = 1
Funserver.Loot.Bonus.DungeonBoss = 1
Funserver.Loot.Bonus.RaidBoss = 1
Funserver.Loot.Bonus.SelectionMultiplier = 8
Funserver.Loot.Bonus.DuplicateDecay = 0.25
# Bonus loot also for the reviewed boss reward chests in
# gameobject_loot_bonus_registry (#345, core#135). Owner decision 2026-09-26.
Funserver.Loot.Bonus.BossChest = 1
# Audited open-world rares (#298): accelerated respawn and independent spawning
# outside their pools. Owner approval 2026-09-24 (#319). No effect without the
# creature_rare_respawn_registry migration.
Funserver.Rare.Respawn.Enabled = 1
Funserver.Rare.PoolBypass.Enabled = 1
# Fixed loot units per kill with quality weights and BoE pool (#323, core#142).
# Owner decisions F8-F10 2026-09-26 (#323): defaults as recommended, legendary
# weight 5 for rares and dungeon bosses ("just for fun").
Funserver.Loot.Units.Enabled = 1
Funserver.Loot.Units.Weight.Rare.Legendary = 5
Funserver.Loot.Units.Weight.Dungeon.Legendary = 5
# One aggregated "Tick stats:" line per minute in perf.log (count, p50/p95/p99,
# max, ticks over 100 and 200 ms) for the D1 scaling gate (#351, core#154).
PerformanceLog.TickStats = 1
PerformanceLog.TickStatsInterval = 60
# Every quest sharable, no "not eligible" before a catch-up (core#159). Owner
# decision 2026-09-26 ("für alle").
Funserver.Quests.AllSharable = 1
# mod-bot-brain reads its keys through sConfig, i.e. from mangosd.conf, not
# from mod_bot_brain.conf. Until 2026-09-24 these were hand-copied into the live
# mangosd.conf after rendering (#321); they are rendered from here now. Values
# as they run live, which match mod_bot_brain.conf.
BotBrain.Enable = 1
BotBrain.Endpoint = "http://bot-brain:8085"
BotBrain.TimeoutMs = 750
BotBrain.IntervalMs = 15000
BotBrain.BackoffMs = 60000
BotBrain.BatchFlushMs = 200
BotBrain.MaxInFlight = 8
BotBrain.MaxPois = 24
BotBrain.PoiTableTtlMs = 120000
BotBrain.LogAppliedIntents = 1
BotBrain.Dialogue.Enable = 0
BotBrain.Dialogue.TimeoutMs = 8000
BotBrain.Dialogue.MaxInFlight = 8
BotBrain.Dialogue.Commands.Enable = 0
# Train 7.2 (#319, Ae15 hotfix train, no DB change): the /who list may be requested every 5 s
# per player instead of the fixed 30 s (core#210, template default 30).
WhoList.RequestCooldownSeconds = 5
# Train 7.3 (#319, #429; owner go 2026-09-29, core#220): five-player dungeons drop 2-4 loot units,
# raids use their own ranges per map (unlisted raids keep Funserver.Loot.Units.Raid).
Funserver.Loot.Units.Dungeon.Range = 1
Funserver.Loot.Units.Raid.Range = "409:6-8,469:4-6,249:4-6,531:4-6,819:3-5,533:3-5,814:2-4"
# Train 9 (#482 owner rule table v5, OB-20, core PR ob20/482-loot-rules-zug9): raid profiles, dungeon bands
# and the trim rule replace the units and ranges above for the listed maps (built-in map, band and token
# lists). Loot beyond the 16 client slots waits in the overflow and refills on reopen (tested 2026-10-04).
Funserver.Loot.Rules482.Enabled = 1
Loot.MaxItems = 32
# Owner 2026-10-04 (#482): epics of dungeon bosses weigh 100 in the v5 extra draws (was 10); mounts stay
# in the draws. Example: Ironfoe about 1 % -> about 16 % per Thaurissan kill (OB-20 calculation).
Funserver.Loot.Units.Weight.Dungeon.Epic = 100
# Owner 2026-10-04 (#482 round 2): mounts keep weight 100; at most 35 % "any epic" per dungeon boss;
# legendary preset A (Thunderfury ~2, Sulfuras ~3, Atiesh ~3.3 runs); dungeon BoE pool epics weigh like
# blues (any epic per pool draw about 11-28 % by level, each item about equally likely).
Funserver.Loot.Rules482.DungeonEpicMaxChance = 35
Funserver.Loot.Rules482.LegendaryPreset = "A"
Funserver.Loot.Units.BoePool.EpicShare = 1
# Train 8 (#338 owner decisions 2026-09-28/30, OB-20): dynamic respawn in the open world.
# Caves keep their original time: MinIndoorRespawnTime = AffectRespawnTimeBelow (900), and the core
# caps the delay at the original. MinEliteRespawnTime stays at the template default 0.
DynamicRespawn.PlayersThreshold = 3
DynamicRespawn.PercentPerPlayer = 5
DynamicRespawn.MaxReductionRate = 0.5
DynamicRespawn.MinRespawnTime = 30
DynamicRespawn.MinIndoorRespawnTime = 900
