# Optional TEST-SERVER/Funserver profile. Preserve existing cheats and add taxi.
AiPlayerbot.RndBotCheats = repair,breath,item,taxi
# Persistent roster profession training (#306, core a64242e8): opportunistic,
# from level 1, trainers within 120 yd, free for the roster, throttled trace.
AiPlayerbot.ProfessionTraining.FreeForPersistentRoster = 1
AiPlayerbot.ProfessionTraining.StartLevel = 1
AiPlayerbot.ProfessionTraining.LocalTrainerRadius = 120
AiPlayerbot.ProfessionTraining.Trace = 1
AiPlayerbot.ProfessionTraining.TraceCooldownSeconds = 300
# Operating switches as they run live (#321, group A): persistent roster,
# quest-first progression with travel trace, no random grouping of nearby bots
# (bot behaviour, OB-10; effect on deaths in #276/#277).
AiPlayerbot.PersistentActiveRoster.Enabled = 1
AiPlayerbot.QuestFirstProgression.Enabled = 1
AiPlayerbot.QuestFirstProgression.TraceTravelDecisions = 1
AiPlayerbot.RandomBotGroupNearby = 0
# Release train 2 (#319), pinned explicitly at the core defaults so a later
# default change cannot move them silently (#306 drift lesson):
# death-route cap for quest turn-ins (#307), graveyard bound (#276), bounded
# master wait for dead bots (#277).
AiPlayerbot.QuestFirstProgression.TurnInMaxDeathsOnRoute = 2
AiPlayerbot.QuestFirstProgression.TurnInDeathRouteCooldownSeconds = 3600
AiPlayerbot.MaxAlternateGraveyardDistance = 2500
AiPlayerbot.DeadWaitForRealMasterSeconds = 180
AiPlayerbot.DeadWaitForRealMasterInstanceSeconds = 600
# Equip-decision diagnostics (#308), on for the #308 measurement window
# (OB-10, #319); back to 0 in a follow-up config PR.
AiPlayerbot.EquipDiagnostics.Trace = 1
# Release train 3 (#319): bots do not use the auction house (owner decision
# 2026-09-25, #308): no AH hoarding, travel or bids; vendor selling unchanged.
AiPlayerbot.AuctionHouse.Enabled = 0
# Release train 4 (#319), pinned at the core defaults: no cross-continent quest
# routes below level 10 (#307), quest areas at most 5 levels above the bot
# (#335), progress-aware quest objectives (#329, 0 = old time budget).
AiPlayerbot.QuestFirstProgression.MinLevelForCrossMapQuestRoute = 10
AiPlayerbot.QuestFirstProgression.QuestAreaLevelMargin = 5
AiPlayerbot.QuestFirstProgression.ProgressAwareObjectives = 1
# Per-destination death rule (#307, core#138), pinned at the core defaults:
# a travel target where a bot died twice is avoided for an hour.
AiPlayerbot.DestinationDeaths.Max = 2
AiPlayerbot.DestinationDeaths.CooldownSeconds = 3600
# Release train 5 (#319). Shared danger map for roster travel targets (#307,
# core#140): on; the tuning keys pinned at the core defaults.
AiPlayerbot.DangerMap.Enabled = 1
AiPlayerbot.DangerMap.CellSize = 100
AiPlayerbot.DangerMap.WindowSeconds = 7200
AiPlayerbot.DangerMap.MinDeaths = 3
AiPlayerbot.DangerMap.LevelMargin = 3
AiPlayerbot.DangerMap.LineSamples = 20
# Roster bots gather within 40 yd and craft with their professions (#333,
# core#146), with a throttled [ProfessionUse] trace.
AiPlayerbot.ProfessionUse.GatherDistance = 40
AiPlayerbot.ProfessionUse.Craft = 1
AiPlayerbot.ProfessionUse.CraftIntervalSeconds = 300
AiPlayerbot.ProfessionUse.Trace = 1
AiPlayerbot.ProfessionUse.TraceCooldownSeconds = 300
# Role- and profession-aware group rolls, stage 1 (#341, core#151), traced.
AiPlayerbot.LootRoll.RoleAware = 1
AiPlayerbot.LootRoll.Trace = 1
# Roster bots leave zones clearly above their level (#307, core#153).
AiPlayerbot.ZoneEscape.Enabled = 1
AiPlayerbot.ZoneEscape.CooldownSeconds = 600
# [FollowDiag] trace for the #303 acceptance (core#150).
AiPlayerbot.FollowDiagnostics = 1
# Player commands for roster bots (#354, #292; core#144/#145), pinned at the
# code defaults: GM bypass from account level 3 (owner-confirmed), 300 s
# between two player summons of the same bot.
AiPlayerbot.RosterControl.GmMinSecurity = 3
AiPlayerbot.RosterControl.SummonCooldownSeconds = 300
