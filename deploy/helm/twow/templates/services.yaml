{{- $fullName := include "twow.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  # Headless: the StatefulSet needs stable per-pod DNS, and a realm is addressed
  # individually rather than load balanced -- a client handed a random worldserver
  # would land on the wrong realm's characters.
  name: {{ $fullName }}-mangosd
  labels: {{- include "twow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mangosd
  {{- with .Values.mangosd.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: world
      port: {{ .Values.mangosd.service.port }}
      targetPort: world
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "twow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mangosd
---
apiVersion: v1
kind: Service
metadata:
  # The externally reachable worldserver endpoint. realm.address must resolve to
  # whatever fronts this (LoadBalancer IP, ingress, NAT), because the client
  # dials it directly from outside the cluster.
  name: {{ $fullName }}-mangosd-ext
  labels: {{- include "twow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mangosd
  {{- with .Values.mangosd.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mangosd.service.type }}
  ports:
    - name: world
      port: {{ .Values.mangosd.service.port }}
      targetPort: world
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "twow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mangosd
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-realmd
  labels: {{- include "twow.labels" . | nindent 4 }}
    app.kubernetes.io/component: realmd
  {{- with .Values.realmd.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.realmd.service.type }}
  ports:
    - name: auth
      port: {{ .Values.realmd.service.port }}
      targetPort: auth
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "twow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: realmd
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "twow.serviceAccountName" . }}
  labels: {{- include "twow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing here talks to the API server.
automountServiceAccountToken: false
{{- end }}
