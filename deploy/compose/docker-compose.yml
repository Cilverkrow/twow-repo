# Tortoise-WoW: full server stack (MariaDB + realmd + mangosd).
#
# The one-command contract lives in the root Makefile; `make up` renders configs
# from .env, checks that client data exists, and only then runs this file.
# Running `docker compose` here directly works, but skips those guard rails.
#
# Deliberate choices, because they are the ones that bite:
#
#  * Client data (dbc/maps/vmaps/mmaps) is bind-mounted, never baked into an
#    image: it comes out of a retail client, so shipping it would be both a
#    licensing problem and a multi-gigabyte one. See the `tools` profile.
#  * mangosd needs a console on stdin or it exits on EOF. The image entrypoint
#    (deploy/docker/entrypoint-mangosd.sh) already solves that with a FIFO;
#    nothing here should try to bolt on a tty.
#  * The build context is the repo root, because Dockerfile.core copies the whole
#    source tree. .dockerignore strips core/sql/ from that context, which is why
#    db-init bind-mounts it rather than expecting it inside the image.

name: twow

x-core-build: &core-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile.core
  # REQUIRED. Without it BuildKit builds the LAST stage in the Dockerfile,
  # which is `ci-staged` -- a CI-only stage whose body is `COPY ${STAGE}
  # ${PREFIX}` from ./stage, a directory that exists only after ci.yml has
  # staged an install into it. In a normal checkout that copies nothing, so the
  # image comes out with an EMPTY /opt/turtle/bin and both servers die on
  # startup:
  #     realmd:  exec /opt/turtle/bin/realmd failed: No such file or directory
  #     mangosd: /opt/turtle/bin/mangosd: not found
  # The failure is silent at build time -- the image builds fine, it just has
  # no binaries in it -- so `make up --build` produced a broken stack with no
  # error to search for. publish.yml has always pinned `target: runtime`;
  # compose never did.
  target: runtime
  args:
    TW_ARCH: ${TW_ARCH:-x86-64-v2}
    MODULES: ${MODULES:-static}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: mariadb:11.8
    # 11.8 is pinned, not "latest": it is the version INSTALL-LINUX.md verifies,
    # and the LTS with native VECTOR, which bot memory needs later (ADR-0027).
    # Its default collation (utf8mb4_uca1400_ai_ci) differs from the utf8mb3
    # dumps under core/sql/, which is where "Illegal mix of collations" comes from --
    # hence the explicit server collation below.
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/compose/.env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Loopback by default. An exposed 3306 carrying a game-server password is
      # how these boxes get taken; BIND_ADDR exists for LAN play, but prefer
      # leaving the database off it entirely.
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging

  db-init:
    # One-shot bootstrap, idempotent through stage markers on the db-init volume:
    # each stage runs once and is skipped forever after. That matters because
    # create_databases.sql leads with DROP TABLE IF EXISTS -- a blind re-run
    # would wipe a populated realm without saying so.
    image: mariadb:11.8
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      DB_USER: ${DB_USER:-turtle}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/compose/.env}
      REALM_NAME: ${REALM_NAME:-TurtleWoW}
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      WORLD_PORT: ${WORLD_PORT:-8090}
      IMPORT_PLAYERBOTS: ${IMPORT_PLAYERBOTS:-ON}
    volumes:
      - db-init-state:/state
      - ./db-init.sh:/db-init.sh:ro
      # The pinned core owns every migration stream. /sql and /sql-core resolve
      # to the same tree by default: db-init.sh reconciles the two, and the
      # platform-side mount stays as a seam for a deployment that overrides
      # SQL_PATH with extra project migrations. There is no platform sql/ tree
      # in this repository -- there was, it drifted behind core, and a published
      # image bootstrapped from it died on a table core had already added.
      - ${SQL_PATH:-../../core/sql}:/sql:ro
      - ${CORE_SQL_PATH:-../../core/sql}:/sql-core:ro
      - ${SQL_BASE_PATH:-../../core/sql/base}:/sql-base:ro
      - ${PLAYERBOTS_SQL_PATH:-../../core/modules/mod-playerbots/sql}:/sql-playerbots:ro
      - ${PLAYERBOTS_OVERLAY_SQL_PATH:-../../deploy/sql/playerbots}:/sql-playerbots-overlay:ro
      - ${BOT_BRAIN_SQL_PATH:-../../modules/mod-bot-brain/sql}:/sql-bot-brain:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    healthcheck:
      # A one-shot job is gated by service_completed_successfully, not by health.
      # This exists only so `docker compose ps` says something useful mid-run.
      test: ["CMD-SHELL", "test -f /state/.bootstrap-complete"]
      interval: 15s
      timeout: 5s
      retries: 240
      start_period: 30s
    restart: "no"
    logging: *default-logging

  realmd:
    build: *core-build
    image: ${IMAGE_REPO:-twow/core}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # The image ENTRYPOINT is the mangosd FIFO wrapper; realmd has no console and
    # must bypass it. tini is kept so signals are forwarded and zombies reaped.
    entrypoint: ["/usr/bin/tini", "--", "/opt/turtle/bin/realmd", "-c", "/opt/turtle/etc/realmd.conf"]
    volumes:
      # Individual files, not the directory: mounting over /opt/turtle/etc would
      # hide the .dist templates the image ships, and SYSCONFDIR is compiled into
      # the binary so the directory itself cannot move.
      - ./config/realmd.conf:/opt/turtle/etc/realmd.conf:ro
      - server-logs:/var/log/turtle
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REALM_PORT:-3724}:3724"
    healthcheck:
      # There is no curl or nc in the runtime image; bash /dev/tcp is what exists.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3724"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging

  mangosd:
    build: *core-build
    image: ${IMAGE_REPO:-twow/core}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # The entrypoint translates SIGTERM into `saveall` + `server shutdown 0`
      # and waits this long. It deliberately never SIGKILLs.
      MANGOSD_SHUTDOWN_GRACE: ${MANGOSD_SHUTDOWN_GRACE:-120}
    volumes:
      # See the note on realmd: files, not the directory.
      - ./config/mangosd.conf:/opt/turtle/etc/mangosd.conf:ro
      - ./config/aiplayerbot.conf:/opt/turtle/etc/aiplayerbot.conf:ro
      # Client data: extracted from a game client, read-only, never in an image.
      # `make extract` (tools profile) produces it.
      - ${DATA_PATH:-./data}:/opt/turtle/data:ro
      - server-logs:/var/log/turtle
      # Read only by the auto-updater, which ships disabled -- see config/ and
      # the note in render-config.sh about the 'manual' migration hashes. Same
      # tree db-init reads: the updater must not see an older copy than the one
      # the bootstrap applied.
      - ${SQL_PATH:-../../core/sql}:/opt/turtle/sql:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WORLD_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "bash", "-c", "test -p /opt/turtle/run/mangosd.in && exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start loads the world and builds the bot travel graph; the
      # systemd unit in INSTALL-LINUX.md allows 900s for exactly this.
      start_period: 900s
    # Must exceed MANGOSD_SHUTDOWN_GRACE, or Docker SIGKILLs mid-save and you get
    # precisely the truncated character state the entrypoint exists to prevent.
    stop_grace_period: 180s
    logging: *default-logging

  # ------------------------------------------------------------------ profiles

  extractor:
    # `make extract`, i.e. docker compose --profile tools run --rm extractor.
    # Its own Dockerfile because Dockerfile.core builds with USE_EXTRACTORS=OFF:
    # the extractors have no business in the server image.
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.tools
    image: ${IMAGE_REPO:-twow/core}-tools:${IMAGE_TAG:-dev}
    volumes:
      - ${CLIENT_PATH:-./client}:/client:ro
      - ${DATA_PATH:-./data}:/out
      - ./extract-client-data.sh:/extract-client-data.sh:ro
    entrypoint: ["/bin/bash", "/extract-client-data.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -d /out"]
      interval: 60s
      timeout: 5s
      retries: 1
    logging: *default-logging

  adminer:
    # Dev-only database browser. Do not enable this on a public host.
    profiles: ["dev"]
    image: adminer:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

volumes:
  db-data:
  db-init-state:
  server-logs:
