# The single per-push pipeline.
#
# WHY ONE FILE. Seven workflows used to fire on every push: 19 job entries, and
# the server compiled roughly five times (gcc, clang, all-features-off, the test
# build, and `docker compose build` inside smoke). A full compile is ~25 minutes,
# so with several branches in flight the runner pool was permanently saturated
# and everybody queued behind a compile that had already happened four times.
#
# This file is that pipeline collapsed into one DAG:
#
#   capacity ---> integration   (nothing compiles here)
#          +----> build-and-test ---> smoke
#   lint -----------------------+
#
#   windows-compile        (DISABLED 2026-09-02 - manual dispatch only)
#
# Six job entries. ONE full server compile per push, in the build-and-test job,
# and smoke consumes the image that build produced instead of building its own.
#
# That claim was not true for a while and the numbers said so: build-and-test
# measured 77 minutes, 71 of them recompiling the whole tree a second time
# inside `docker build`, where the Dockerfile's ccache is a BuildKit cache mount
# and type=gha cannot export one. The compile now happens once, on the runner,
# in a container made from the Dockerfile's own toolchain stage, and the image
# is assembled from what it installed. The build-and-test job below says exactly
# what that still verifies and what it no longer does.
#
# What is deliberately NOT here:
#   * the clang build and the all-features-off invariant build - nightly.yml.
#     They catch slow-moving breakage, not "this push is broken", so paying for
#     them on every push bought latency and nothing else.
#   * publish.yml stays a separate file: different triggers (main and tags only)
#     and far broader permissions (packages/id-token/attestations write). Folding
#     it in here would hand those permissions to every pull request.
#
# Platform split (ADR-0028): Linux is the complete gate, Windows is compile-only.
# A clean clone CANNOT link on Windows - dep/windows/lib and mangosd.ico are
# pinned external inputs kept out of Git (ADR-0019). There is no Windows link job
# and there must never be one.
#
# WHERE THIS RUNS.
#
# GitHub-hosted. This repository is public, so Actions minutes on standard
# hosted runners are free and the billing block that forced a self-hosted
# runner no longer applies.
#
#     runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
#
# The repository variable is still the override: set CI_RUNNER to `self-hosted`
# (the implicit label every self-hosted runner carries) and every Linux job in
# ci.yml, nightly.yml and publish.yml moves in one edit with no commit.
#
# History worth keeping, because it explains code elsewhere in this file. While
# the Linux jobs ran on `k8s-twow-repo` they failed in ways that had nothing to
# do with this repository's contents, and each cost hours to diagnose:
#
#   * `no space left on device`, repeatedly - at container creation, and later
#     mid-link with `ar: unable to copy file 'libmod_mod_dungeon_clear.a'`.
#   * A service container published with `-p 3306:3306` was reachable from the
#     runner pod but not from a `--network host` container, because the daemon
#     was remote (lhns/remote-docker on /run/rd/docker.sock) and had actually
#     published it on :32770.
#   * Container actions that bind-mount /var/run/docker.sock could not start:
#     `nfsserve: cannot export /var/run/docker.sock`.
#
# None of that recurs on hosted runners, where the runner and the daemon share
# one namespace and the disk is a fresh VM. Workarounds added for those
# symptoms are safe to remove once this has run green a few times.
#
# WHAT THAT RUNNER IS NOT. It is a shared Kubernetes pod, not a fresh VM:
#
#   * ~9.2 GiB of RAM free of 31 GiB, with 20 cores visible. An unbounded
#     `ninja -j20` over ~1500 targets with debug symbols will OOM the pod and
#     take whatever else is on it down. Everything that compiles is capped at
#     CI_BUILD_JOBS (below).
#   * ~28 GiB of free disk, shared. The docker daemon is shared too, so the old
#     `docker image prune -af` in "Free runner disk" would delete other
#     tenants' images. It has been narrowed to this pipeline's own tags plus
#     dangling layers.
#   * NOT clean between jobs. The workspace, /state, the docker daemon and any
#     named volumes all survive. Every job below starts by putting the parts of
#     that it depends on back into a known state, and the places where that
#     matters are commented individually - `git clean` inside actions/checkout
#     does not reach /state or the docker daemon.
#
# WINDOWS CI IS DISABLED (2026-09-02, ADR-0028). The windows-compile job below is
# gated behind a workflow_dispatch input and does not run on push, pull_request or
# schedule. The code keeps its Windows support; only the CI job is off. See the
# comment on the job itself for why, and ADR-0028 for how to turn it back on.
name: ci

on:
  push:
    branches: [main, 'refactor/**']
    # A change that touches only prose cannot break a C++ build, and a full run
    # costs around 34 minutes cold. A large share of the commits on this project
    # are issue manifests, ADRs and runbook evidence; each of those was buying a
    # full compile to prove that Markdown still parses.
    #
    # Deliberately NOT ignored: ops/ (it holds the audit scripts CI runs),
    # .github/ (the workflows themselves), and any *.md inside src/ or modules/,
    # because those sit beside code and a path filter that swallowed them would
    # be surprising. AGENTS.md is likewise not ignored -- it is the handover
    # contract, and a broken one is worth a run.
    paths-ignore:
      - 'docs/**'
      - 'runbooks/**'
      - 'README.md'
      - 'INSTALL-*.md'
      - 'PLAYERBOTS_QUICKSTART.md'
      - 'CONTRIBUTING.md'
      - 'AUTHORS.md'
  pull_request:
  # Nightly backstop on main, inherited from smoke.yml and integration.yml. Both
  # of those had their own cron for the same reason: the stack can break from a
  # base-image change - a new mariadb:11.8 point release, a new debian:trixie -
  # with nobody having touched the repository. Running the whole DAG is simpler
  # than singling those two out, and it is one run.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_windows_compile:
        description: >-
          Also run the MSVC compile-only job. Requires a Windows runner this repo
          does not currently have - see ADR-0028. Default off.
        type: boolean
        default: false

concurrency:
  # Nothing cancels anything. Every commit gets its own group and runs to
  # completion.
  #
  # This was already true for pushes, and the reasoning is recorded because it
  # was learned the hard way: one group per ref with cancel-in-progress looks
  # like an obvious saving, but a full run is 26+ minutes, so an afternoon of
  # active work produced ZERO completed runs - four were killed between 20 and
  # 26 minutes by the next push, including the ones meant to measure whether a
  # pipeline rework had worked. Cancelling saved runner minutes and cost hours
  # of wall clock.
  #
  # Pull requests were left cancelling on the argument that only the tip of a PR
  # is interesting. That argument is wrong for the same reason: a branch with an
  # open PR fires pull_request on every push, so the exact commits being worked
  # on were the ones that never finished, while pushes to branches nobody was
  # watching ran to completion. The observable effect was a PR that could not
  # produce a green tick while it was being actively developed.
  #
  # Including the SHA in the group unconditionally gives every commit its own
  # group: nothing is cancelled, nothing queues behind anything.
  #
  # The trade is runner minutes on busy branches. That is the intended trade -
  # a result that arrives is worth more than a runner minute saved, and a run
  # killed at minute 25 cost the minutes anyway and produced nothing.
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  # Compile parallelism, for every step that compiles anything. An EXPLICIT
  # number, deliberately, and this is the part worth reading before changing it.
  #
  # `-j$(nproc)` is the obvious form and it is WRONG on this runner. /proc is
  # not namespaced, so inside the runner pod:
  #
  #     nproc      ->  20      the NODE's CPUs
  #     free -g    ->  31Gi    the NODE's memory
  #     cpu.max    ->  max     no CPU limit at all
  #     memory.max ->  8Gi     the actual ceiling, and the only true number
  #
  # A job that sizes itself from nproc or free therefore launches 20 compilers
  # against an 8 GiB cgroup and is OOM-killed. That does not surface as "out of
  # memory": it surfaces as ninja reporting a signal, or as the assembler
  # failing to write an object file - which reads exactly like running out of
  # disk - or as a job that simply hangs. Every automatic form of this
  # (`nproc`, `free`, `--parallel` with no argument, ninja's own default) has
  # the same defect, so the number is pinned here instead.
  #
  # Why 4. The heavy translation units in this tree peak around 1.5-2.5 GiB
  # resident each with debug symbols on, and DEBUG_SYMBOLS defaults to ON. Four
  # is also exactly what a GitHub-hosted ubuntu-24.04 runner has (4 vCPU,
  # 16 GB), so the same pinned number is correct in both places and this file
  # stays portable - which is the requirement. Raise it with the CI_BUILD_JOBS
  # repository variable only against a measurement, not against `nproc`.
  #
  # Where the cap has to be repeated, because one setting cannot reach
  # everything that compiles:
  #
  #   * steps that call ops/ci/in-builder.sh pass it on the command line, and
  #     the script also forwards CI_BUILD_JOBS into the container so anything
  #     running in there inherits it without a call site having to remember;
  #   * compiles inside `docker build` (nightly's docker-from-source,
  #     publish's core) are on the workspace daemon, out of this file's reach
  #     entirely, and are capped by Dockerfile.core's BUILD_JOBS arg - whose
  #     own default is a number, not nproc, so a caller that forgets is slow
  #     rather than OOM-killed.
  #
  # One thing -j does NOT bound at all: the single link of mangosd, which wants
  # several GiB on its own and cannot be split.
  CI_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}

  # The tag deploy/compose/docker-compose.yml resolves to by default
  # (${IMAGE_REPO:-twow/core}:${IMAGE_TAG:-dev}). build-and-test tags the image
  # it produces with exactly this, so `compose up` in the smoke job finds it
  # locally and never tries to build or pull.
  CORE_IMAGE: twow/core:dev

jobs:
  # A normal job's service containers start before its first step. Capacity
  # therefore has to be its own dependency if a full disk is to stop MariaDB,
  # BuildKit and the compiler before any of them allocate more space.
  capacity:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: capacity preflight
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Measure runner workspace capacity
        env:
          CI_MIN_WORKSPACE_FREE_GIB: ${{ vars.CI_MIN_WORKSPACE_FREE_GIB || '8' }}
        run: |
          bash ops/ci/check-capacity.sh \
            --label runner-workspace \
            --path "$GITHUB_WORKSPACE" \
            --minimum-gib "$CI_MIN_WORKSPACE_FREE_GIB"

      - name: Measure Docker data-root capacity
        env:
          # Run 115 started with 19 GiB on the daemon disk and exhausted it at
          # 1349/1369 objects. Twenty-two GiB is the measured lower gate, not a
          # percentage of an unrelated runner filesystem.
          CI_MIN_DOCKER_FREE_GIB: ${{ vars.CI_MIN_DOCKER_FREE_GIB || '22' }}
        run: |
          set -eu
          docker info >/dev/null
          docker_free_kib=$(docker run --rm --pull=missing alpine:3.22 \
            sh -c "df -Pk / | awk 'END { print \$4 }'")
          bash ops/ci/check-capacity.sh \
            --label docker-data-root \
            --minimum-gib "$CI_MIN_DOCKER_FREE_GIB" \
            --available-kib "$docker_free_kib"
          docker system df

  # ---------------------------------------------------------------- lint
  #
  # Everything that is not a compiler, in ONE job.
  #
  # It used to be seven jobs, one per check: seven runners and seven checkouts to
  # run a few minutes of shell. The reason it was split - so a failing check does
  # not hide the ones after it - is preserved by giving every step `if: always()`.
  # Each runs regardless of what failed before it, and the job still reports
  # failure, because a failed step fails its job even when later steps succeed.
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: lint
    timeout-minutes: 20
    steps:
      # The runner is shared and NOT clean between jobs. Two things about it
      # differ from a GitHub-hosted VM, and most of the steps below depend on
      # one of them:
      #
      #   * privilege. A hosted VM runs as a passwordless-sudo user. A runner
      #     in a container is usually already root and frequently has no sudo
      #     binary at all, so a bare `sudo apt-get` is a command-not-found
      #     rather than a permission error. $SUDO is resolved once, here, and
      #     used by every step below that needs privilege.
      #   * state. Whatever a previous job left in the workspace, on the disk,
      #     in the docker daemon or in a named volume is still there. Each
      #     place that matters is dealt with where it matters and says so.
      #
      # It also prints which runner claimed the job, which is the single line
      # that distinguishes "this ran on the self-hosted pod" from "this ran
      # somewhere else" when reading a log later.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?}, ${RUNNER_ENVIRONMENT:-unknown})"
          echo "user   : $(id)"
          echo "sudo   : ${SUDO:-<none>}"
          echo "jobs   : ${CI_BUILD_JOBS:-<unset>} pinned"
          # nproc and free report the NODE, not this job's cgroup - see the
          # env block at the top of this file. The cgroup files are the only
          # honest numbers, so print those and label the others as untrue.
          echo "nproc  : $(nproc 2>/dev/null || echo '?') <- NOT a limit, this is the node"
          memmax=$(cat /sys/fs/cgroup/memory.max 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
            || echo n/a)
          echo "mem.max: $memmax <- the real ceiling"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
          uname -a
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      # fetch-depth: 0 because gitleaks scans history and the added-file checks
      # diff against a base commit.
      #
      # No submodules: nothing this job reads lives under core/. `clean` is left
      # at its default of true on purpose - on a self-hosted runner the
      # workspace is reused, and the `git clean -ffdx` that checkout does is the
      # only thing removing a previous job's build tree, /tmp droppings and
      # stray artefacts from this directory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The security verdict remains mandatory. Only the optional artifact
          # upload is disabled because this runner's HOME and workspace do not
          # share a parent path and the uploader rejects that topology.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # .gitleaksignore holds exactly one audited false positive. Broadening it
      # is how a real secret gets waved through, so the file's size is checked
      # rather than trusted (FG-012).
      - name: Reject broadened gitleaks suppressions
        if: always()
        run: |
          entries=$(grep -cv '^\s*\(#.*\)\?$' .gitleaksignore || true)
          echo "gitleaksignore entries: $entries"
          if [ "$entries" -gt 3 ]; then
            echo "::error::.gitleaksignore has $entries entries. Each must be individually audited - see FG-012."
            exit 1
          fi

      # Invariant 5 (ADR-0024) and ADR-0004: no binaries, no client data, no
      # build output. The repository history was already rewritten once to
      # remove binaries; FG-006 forbids doing that again, so nothing binary may
      # get in in the first place.
      - name: No binaries or large files
        if: always()
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          added=$(git diff --name-only --diff-filter=A "$base" HEAD || true)
          [ -n "$added" ] || { echo "no added files"; exit 0; }
          fail=0
          for f in $added; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe|*.dll|*.so|*.dylib|*.lib|*.a|*.o|*.obj|*.pdb|*.ico|\
              *.mpq|*.dbc|*.map|*.vmap|*.mmap|*.zip|*.7z|*.rar)
                echo "::error file=$f::binary artifact must not be committed (ADR-0004, ADR-0019)"
                fail=1 ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$f::$size bytes exceeds the 5 MB limit for new files"
              fail=1
            fi
          done
          exit $fail

      # 46 runbook paths are cited from docs/ and AGENTS.md. Those citations are
      # the only thing connecting a decision to its evidence, so a dead one is a
      # real defect rather than a cosmetic issue.
      - name: Doc links resolve
        if: always()
        run: |
          # grep -P refuses to run outside a unibyte or UTF-8 locale.
          export LC_ALL=C.UTF-8
          fail=0
          # grep -o with -n gives "file:line:match"; the match is the link
          # target because \K drops everything before it.
          grep -rnoP '\]\(\K[^)#:]+\.(md|json|txt|sql|tsv|ps1)(?=\))' \
               docs/ AGENTS.md --include='*.md' > /tmp/links.txt || true
          while IFS= read -r entry; do
            file="${entry%%:*}"
            target="${entry##*:}"
            resolved="$(realpath -m "$(dirname "$file")/$target")"
            if [ ! -e "$resolved" ]; then
              echo "::error file=$file::dead link -> $target"
              fail=1
            fi
          done < /tmp/links.txt
          echo "checked $(wc -l < /tmp/links.txt) links"
          exit $fail

      # Installed only if missing. On a hosted VM shellcheck is absent every
      # time; on the self-hosted runner it survives between jobs, and paying for
      # an apt-get update on a shared box to reinstall a package that is already
      # there is pure latency.
      - name: shellcheck
        if: always()
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
          find ops deploy sql -name '*.sh' -print0 2>/dev/null \
            | xargs -0 -r shellcheck --severity=warning

      # The issue importer has created duplicates or silently no-opped four
      # times: title matching (27 duplicates), `--state open` in the existence
      # check (REF-001/REF-002 refiled as #85/#86 after #79/#80 were closed),
      # `--state open` in the --update resolver (a silent no-op on every closed
      # issue), and a docs/issues/*.md glob that read README.md as a manifest.
      # A comment explaining the second sat directly above the code that caused
      # the third, so prose is demonstrably not enough. This runs the rules.
      # It needs jq (preinstalled on ubuntu-24.04) and talks to no network.
      - name: Issue tooling guard
        if: always()
        run: bash ops/audit/issue-tooling-guard.sh

      # The platform used to carry sql/ at the root: a near-duplicate of
      # core/sql that nothing kept in step, that db-init.sh read in preference
      # to the core's, and that killed a published server at world load on a
      # table core had already added. It is gone; this stops it coming back.
      #
      # This job checks out no submodules, so what runs here is the structural
      # half - "sql/ is back at the root", which is the regression that
      # actually happened and the cheap one to catch on every push. The
      # content half needs core/sql and runs in `bootstrap from empty`, which
      # checks out submodules already.
      - name: No duplicate of the core SQL tree
        if: always()
        run: bash ops/audit/no-duplicate-core-sql.sh

      - name: hadolint
        if: always()
        run: |
          # A container action tries to mount /var/run/docker.sock, which does
          # not exist on the remote-docker runner. Invoke the binary explicitly:
          # the pinned Alpine image has no entrypoint on this daemon.
          docker run --rm -i hadolint/hadolint:v2.12.0-alpine \
            hadolint --ignore DL3008 - < deploy/docker/Dockerfile.core

      # pipx is preinstalled on ubuntu-24.04 and is NOT on a plain Debian
      # runner image, so this cannot assume it. Order: an already-installed
      # yamllint, then pipx, then a throwaway venv - the last of which needs
      # only python3 and works anywhere.
      - name: Validate ordinary YAML
        if: always()
        run: |
          set -eu
          if ! command -v yamllint >/dev/null 2>&1; then
            if command -v pipx >/dev/null 2>&1; then
              pipx install yamllint
            else
              python3 -m venv /tmp/yamllint-venv
              /tmp/yamllint-venv/bin/pip install --quiet yamllint
              echo "/tmp/yamllint-venv/bin" >> "$GITHUB_PATH"
              export PATH="/tmp/yamllint-venv/bin:$PATH"
            fi
          fi
          # Raw Helm Go templates are not YAML. Lint ordinary YAML here and
          # validate the chart only after Helm has rendered it below.
          find .github/workflows deploy -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -path 'deploy/helm/*/templates/*' -print0 \
            | xargs -0 -r yamllint \
                -d '{extends: relaxed, rules: {line-length: {max: 120}}}' \
                2>&1 | tee /tmp/yamllint.txt
          ! grep -q ' error ' /tmp/yamllint.txt

      - name: Render and validate Helm templates
        if: always()
        run: |
          set -eu
          render_once() {
            tar -C deploy/helm -cf - twow \
              | docker run --rm -i --entrypoint sh alpine/helm:3.18.6 -c '
                  set -eu
                  mkdir -p /work
                  tar -xf - -C /work
                  helm template ci /work/twow --namespace twow-ci \
                    --values /work/twow/values-dev.yaml'
          }
          tar -C deploy/helm -cf - twow \
            | docker run --rm -i --entrypoint sh alpine/helm:3.18.6 -c '
                set -eu
                mkdir -p /work
                tar -xf - -C /work
                helm lint /work/twow --values /work/twow/values-dev.yaml'
          render_once > /tmp/twow-rendered-1.yaml
          render_once > /tmp/twow-rendered-2.yaml
          cmp /tmp/twow-rendered-1.yaml /tmp/twow-rendered-2.yaml
          # Rendered manifests may contain harmless whitespace emitted by Go
          # templates. This pass is intentionally syntax-only; ordinary source
          # YAML above retains the full lint policy.
          yamllint -d '{extends: relaxed, rules: {trailing-spaces: disable, indentation: disable, line-length: disable}}' \
            /tmp/twow-rendered-1.yaml
          echo "helm rendered deterministically: $(sha256sum /tmp/twow-rendered-1.yaml | cut -d' ' -f1)"

      # Module isolation. `modules` is the shared loader library, so anything
      # PUBLIC on it lands on every other module's compile line.
      # mod-dungeon-clear did exactly this: 25 playerbots include dirs, a link
      # to playerbots, and `-include AcCompat.h` -- so module #2 would have
      # silently inherited an AzerothCore name shim it never asked for. Each
      # module owns a target now and configures that one, in both linkage modes.
      - name: Modules do not mutate the shared target
        if: always()
        run: |
          # No exceptions. mod-dungeon-clear used to be one: in static linkage
          # its sources went into the shared library, so its include paths and
          # its AcCompat.h force-include had nowhere else to go. Every module
          # owns a target in static linkage now, so it configures its own.
          #
          # Both roots are globbed. mod-playerbots and mod-dungeon-clear build
          # from core/modules/ now (ADR-0040) and are exactly the two modules
          # this check exists for, so a glob that only saw modules/ would have
          # stopped watching the code that motivated it.
          #
          # The `^[^#]*` prefix skips comment lines. core's mod-playerbots.cmake
          # spells out the very call this rejects, twice, in the comment saying
          # why it does not make it -- and a check that fires on the explanation
          # of its own rule teaches the next person to delete the explanation.
          fail=0
          for f in modules/*/*.cmake core/modules/*/*.cmake; do
            [ -f "$f" ] || continue
            grep -nE '^[^#]*target_(link_libraries|include_directories|compile_options|compile_definitions|sources)\([[:space:]]*modules[^a-zA-Z0-9_]' "$f" || continue
            echo "::error file=$f::module cmake mutates the shared 'modules' target; configure mod_<name> instead"
            fail=1
          done
          exit $fail

      # Invariant 2 (ADR-0024): upstream schemas are read-only to us. A module
      # migration that writes an upstream table is the failure this catches.
      - name: Migrations respect schema ownership
        if: always()
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if grep -qiE '\b(tw_world|tw_char|tw_logon|tw_logs)\.' "$f"; then
              echo "::error file=$f::module migration references an upstream schema (ADR-0024 invariant 2)"
              fail=1
            fi
          done < <(find modules -path '*/data/sql/*' -name '*.sql' -print0 2>/dev/null)
          exit $fail

      # Invariant 3: 'manual' is a literal string, not a digest. It made 146
      # world migrations unverifiable (OPS-012); it must never appear again.
      - name: Reject 'manual' migration hashes
        if: always()
        run: |
          # `xargs -r` exits 0 when it gets no input, so piping straight into an
          # `if` made this fire on every push with no added SQL at all. Collect
          # the matches first, then test whether the list is empty.
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          added="$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.sql' || true)"
          [ -n "$added" ] || { echo "no new .sql files"; exit 0; }

          offenders=""
          for f in $added; do
            [ -f "$f" ] || continue
            if grep -q "'manual'" "$f"; then
              offenders="$offenders $f"
            fi
          done

          if [ -n "$offenders" ]; then
            for f in $offenders; do
              echo "::error file=$f::migration uses the literal hash 'manual' - see FG-033, OPS-012"
            done
            exit 1
          fi
          echo "checked $(echo "$added" | wc -w) new .sql file(s), none use 'manual'"

  # ---------------------------------------------------------------- integration
  #
  # The database bootstrap, from empty, against a real MariaDB.
  #
  # This is where the migration path is proven. It runs the actual shipped
  # bootstrap - deploy/compose/db-init.sh, the same script the compose stack and
  # the Helm pre-upgrade Job run - rather than a reimplementation of it, because
  # a reimplementation proves that the reimplementation works.
  #
  # It runs on the runner instead of in the db-init container: same bash, same
  # mariadb client, same SQL tree, and no image build in the way. Bringing the
  # stack up is the smoke job's business; this one is about what the SQL does.
  #
  # What it cannot cover: the `migrations` ledger is written by the server's
  # AutoUpdater (src/shared/Database/AutoUpdater.cpp), and the server needs client
  # data, which is never in an image or in Git (ADR-0023). So the ledger seen here
  # is whatever db-init.sh recorded, and that is exactly what the assertions below
  # examine.
  #
  # It waits only for the capacity preflight. It does not wait for compiled
  # artefacts, so bootstrap and build can still proceed in parallel afterwards.
  # services/bot-brain has 58 tests across 7 packages and, until this job, no CI
  # of any kind: no `go test`, no `go vet`, no build, and its image is never
  # published. Those tests were decoration - a regression in the planner, the
  # wire contract or version negotiation landed green.
  #
  # No submodules and no database: this module is stdlib-only by policy (go.mod
  # has zero requires) and nothing here reads core/ or talks to MariaDB. That is
  # what makes the job cost about a minute.
  go:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: go (bot-brain)
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/bot-brain

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # go-version-file rather than a pinned string, so the toolchain follows
      # go.mod and cannot silently drift from what developers build with. No
      # cache-dependency-path: there is no go.sum, because there are no
      # dependencies, and naming a file that does not exist fails the action.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/bot-brain/go.mod

      # Formatting is a diff, not an opinion: gofmt -l prints the files it would
      # change and says nothing when it would change none.
      # The contract version is declared twice, by hand, in two languages, and
      # BotBrainWire.h asks the reader to keep them in step. Until this, nothing
      # checked. A MAJOR skew fails the handshake closed and every bot silently
      # stops planning; a MINOR skew does not fail closed at all - it negotiates
      # down - so a field one side believes it is sending is quietly not read.
      # working-directory is overridden because this reads both trees.
      - name: contract version agrees across Go and C++
        working-directory: .
        run: bash ops/ci/check-contract-version.sh

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race because the service is concurrent by construction (the Fallback
      # planner, the breaker ticker, the HTTP handlers) and a data race there is
      # exactly the class of bug unit tests otherwise hide.
      # -count=1 defeats the test cache, so a green tick means the tests ran in
      # THIS commit rather than in some earlier one.
      - name: go test
        # CGO_ENABLED=1 explicitly: -race needs cgo, and relying on the runner's
        # default is how this turns red for an environment reason rather than a
        # code one. It is scoped to this step - the shipped binary is built with
        # CGO off (Dockerfile:29) so it can run in a scratch image, and the build
        # step below keeps that.
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      # The same gate the build+test job applies to CTest, for the same stated
      # reason: every step above can be green while nothing was verified. `go
      # test` reports ok on a package with no test files, so counting packages
      # is not enough - count the tests themselves.
      - name: Fail if nothing was tested
        run: |
          ran=$(go test -count=1 -v ./... 2>/dev/null | grep -c '^=== RUN' || true)
          echo "tests executed: $ran"
          if [ "${ran:-0}" -lt 1 ]; then
            echo "::error::go test executed no tests. A green run that tested nothing is worse than a red one."
            exit 1
          fi

      # Proves the binary this service ships can actually be produced, which no
      # job did before: publish.yml builds mangosd, realmd and db-init only.
      - name: build
        # CGO off and GOOS=linux, matching Dockerfile:29, so this proves the
        # artifact that actually ships can be produced - not merely that the code
        # compiles for the runner.
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go build -trimpath ./...

  # The check neither `go` nor `build-and-test` performs: that the Go service
  # and the C++ module actually agree when run against each other, live. `go`
  # above proves the Go side works in isolation; `build-and-test` proves the
  # whole server compiles and links, including bot_brain_wire_tests, but never
  # runs it against a real bot-brain process. Both could stay green forever
  # while a field name the encoder emits is one the Go struct silently drops -
  # that is exactly the failure class ARCH-001 exists to catch, and until this
  # job nothing did.
  #
  # Deliberately its own job rather than a step bolted onto either of the
  # above: `go`'s container has no C++ toolchain, and `build-and-test`'s
  # multi-hour containerised build is the wrong place to add a service you
  # start and kill by hand. This job needs only core/dep/include (rapidjson,
  # header-only) and a stock g++, so it stays a couple of minutes rather than
  # inheriting build-and-test's cost - see tests.cmake for why
  # bot_brain_wire_tests only ever needed that one header directory.
  bot-brain-integration:
    needs: capacity
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: bot-brain live integration
    timeout-minutes: 15

    steps:
      # Recursive for the same reason build-and-test's checkout is: core
      # carries Eluna as its own submodule, and dep/include sits under core/.
      # Nothing here reads core/src or links against the server - only the
      # single header directory tests.cmake already depends on.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/bot-brain/go.mod

      # bot_brain_wire_tests compiled exactly as tests.cmake compiles it: the
      # same two files, the same one include directory, the same golden-dir
      # compile definition. Not run through CMake here, because configuring
      # the whole project just to reach one hermetic two-file target would
      # buy nothing this job needs.
      - name: compile the C++ wire encoder/decoder
        run: |
          g++ -std=c++17 -O0 -Wall \
            -I modules/mod-bot-brain/src \
            -I core/dep/include \
            -DBB_GOLDEN_DIR="\"${GITHUB_WORKSPACE}/contracts/bot-brain/v1/golden\"" \
            modules/mod-bot-brain/t/bot_brain_wire_tests.cpp \
            modules/mod-bot-brain/src/BotBrainWire.cpp \
            -o bot_brain_wire_tests

      # The suite this binary was built to run, unmodified: BB_GOLDEN_DIR
      # points at fixtures that are checked out here as plain files (no world,
      # no service needed), so this also re-proves the encoder/decoder agree
      # with the golden contract before betting the live run on the same
      # binary.
      - name: C++ wire unit suite (sanity before the live run)
        run: ./bot_brain_wire_tests

      # The live check: a real `go build` of the real service, started on
      # loopback, driven over an actual TCP socket by JSON this binary
      # encoded, decoding a response this binary decoded. Then the service is
      # killed and the same request is re-driven to prove the failure is a
      # clean transport error, not a hang or a stale 200 - issue #155's second
      # criterion. See the script for exactly what "FAIL if the service is not
      # running" means here: every network call is unguarded, so a service
      # that never comes up cannot produce a green run.
      - name: live Go service <-> C++ wire code, over a real socket
        env:
          BB_WIRE_TEST_BIN: ${{ github.workspace }}/bot_brain_wire_tests
        run: bash test/integration/bot-brain-live.sh

  integration:
    needs: capacity
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: bootstrap from empty
    timeout-minutes: 90

    services:
      # 11.8 LTS, pinned by ADR-0027 and matching deploy/compose. The server
      # collation is forced for the same reason the compose file forces it: the
      # 11.8 default (utf8mb4_uca1400_ai_ci) disagrees with the utf8mb3 dumps
      # under sql/, and that mismatch is where "Illegal mix of collations" comes
      # from.
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_ROOT_PASSWORD: ci-root
      DB_USER: turtle
      DB_PASSWORD: ci-app
      REALM_NAME: CI
      REALM_ADDRESS: 127.0.0.1
      WORLD_PORT: '8090'
      IMPORT_PLAYERBOTS: 'ON'
      # db-init.sh reads these to find the SQL. In the container they are bind
      # mounts; here they are the tree itself.
      SQL_DIR: core/sql
      CORE_SQL_DIR: core/sql
      SQL_BASE_DIR: core/sql/base
      PB_SQL_DIR: core/modules/mod-playerbots/sql
      PB_OVERLAY_SQL_DIR: deploy/sql/playerbots
      MYSQL_PWD: ci-root

    steps:
      # Resolves $SUDO and prints which runner claimed the job. See the long
      # note on the same step in the lint job.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?}, ${RUNNER_ENVIRONMENT:-unknown})"
          echo "user   : $(id)"
          echo "jobs   : ${CI_BUILD_JOBS:-<unset>} pinned"
          # nproc and free report the NODE, not this job's cgroup - see the
          # env block at the top of this file. The cgroup files are the only
          # honest numbers, so print those and label the others as untrue.
          echo "nproc  : $(nproc 2>/dev/null || echo '?') <- NOT a limit, this is the node"
          memmax=$(cat /sys/fs/cgroup/memory.max 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
            || echo n/a)
          echo "mem.max: $memmax <- the real ceiling"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      # Bootstrap consumes the schema and migration coverage of the pinned core.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # The content half of the lint job's structural check, run here because
      # this is the job that has core/sql checked out. Placed before anything
      # touches the database: if a platform copy of a core migration is back,
      # the bootstrap this job measures is testing the wrong tree and the
      # ninety minutes after this point prove nothing.
      - name: No duplicate of the core SQL tree
        run: bash ops/audit/no-duplicate-core-sql.sh

      - name: Install the MariaDB client
        run: |
          if ! command -v mariadb >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends mariadb-client
          fi
          mariadb --version

      # The dump opens with a /*M!999999 ... */ sandbox directive that only the
      # MariaDB client understands, so `mariadb` is used throughout rather than
      # whichever `mysql` happens to be on the runner.
      - name: Confirm the database is empty
        run: |
          set -eu
          existing=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM information_schema.SCHEMATA
             WHERE SCHEMA_NAME IN ('tw_world','tw_char','tw_logon','tw_logs');")
          if [ "$existing" != "0" ]; then
            echo "::error::not starting from empty - $existing project schemas already exist"
            exit 1
          fi
          echo "starting from empty"

      # STATE is hardcoded to /state in db-init.sh (it is a named volume in the
      # container). Creating it here rather than patching the script keeps this
      # job running the shipped file byte for byte.
      #
      # EMPTIED, not just created. /state is where db-init.sh writes its stage
      # markers, and on a self-hosted runner it is a real directory on a shared
      # pod that outlives the job - so the second run of this workflow would
      # find yesterday's markers, skip every stage, and then assert that a
      # database nobody bootstrapped looks bootstrapped. On a hosted VM /state
      # never existed, which is exactly why nothing here removed it. The
      # database is fresh every run (it is a service container), so the markers
      # must be too, or the two disagree and the job proves nothing.
      - name: Run the shipped bootstrap
        run: |
          set -eu
          $SUDO rm -rf /state
          $SUDO mkdir -p /state
          $SUDO chown "$(id -u):$(id -g)" /state
          time bash deploy/compose/db-init.sh

      - name: Verify pinned core migration coverage and resolver negatives
        run: |
          bash test/smoke/bootstrap-stream-contract.sh
          bash test/smoke/verify-bootstrap-coverage.sh

      # Invariant 3 from the operator's side: running the bootstrap twice must
      # be a no-op. db-init.sh guarantees that with stage markers, and
      # create_databases.sql opens with DROP TABLE IF EXISTS on 415 tables - so
      # a broken marker does not fail loudly, it silently empties a populated
      # realm. That is worth a test.
      #
      # Placed before the assertions so it runs even when they find something.
      - name: Replay the bootstrap and assert nothing changes
        run: |
          set -eu
          snapshot() {
            mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
              "SELECT (SELECT COUNT(*) FROM tw_world.migrations),
                      (SELECT COUNT(*) FROM tw_world.creature),
                      (SELECT COUNT(*) FROM tw_logon.realmlist);"
          }
          before=$(snapshot)
          bash deploy/compose/db-init.sh
          after=$(snapshot)
          echo "before: $before"
          echo "after : $after"
          if [ "$before" != "$after" ]; then
            echo "::error::a second bootstrap changed the database - it is not idempotent"
            exit 1
          fi

      - name: Assert the schemas exist and are populated
        run: |
          set -eu
          for schema in tw_world tw_char tw_logon tw_logs; do
            found=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$schema';")
            [ "$found" = "1" ] || { echo "::error::schema $schema was not created"; exit 1; }
            tables=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$schema';")
            [ "$tables" -gt 0 ] || { echo "::error::schema $schema has no tables"; exit 1; }
            echo "$schema: $tables tables"
          done
          # World content, not just structure. An empty creature table means
          # sql/base never landed and every later assertion is about an empty
          # world.
          creatures=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM tw_world.creature;")
          [ "$creatures" -gt 0 ] || { echo "::error::tw_world.creature is empty - sql/base did not load"; exit 1; }
          echo "tw_world.creature rows: $creatures"

      # One step, one accumulator: every gap is reported in a single run rather
      # than one per re-run.
      - name: Assert every migration directory reached a database
        run: |
          set -eu
          fail=0
          count_files() { find "$1" -maxdepth 1 -name '*.sql' 2>/dev/null | wc -l; }
          rows() {
            mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM $1.migrations;"
          }

          world_files=$(count_files core/sql/database_updates)
          char_files=$(count_files core/sql/character_updates)
          logon_files=$(count_files core/sql/logon)
          world_rows=$(rows tw_world)
          char_rows=$(rows tw_char)
          logon_rows=$(rows tw_logon)
          echo "tw_world : $world_rows ledger rows for $world_files files in core/sql/database_updates"
          echo "tw_char  : $char_rows ledger rows for $char_files files in core/sql/character_updates"
          echo "tw_logon : $logon_rows ledger rows for $logon_files files in core/sql/logon"

          # A ledger with fewer rows than files means something is unrecorded,
          # which is how a migration silently reapplies later.
          check() {
            schema=$1; files=$2; rowcount=$3; dir=$4
            if [ "$files" -gt 0 ] && [ "$rowcount" -eq 0 ]; then
              echo "::error::$dir has $files migration files and $schema.migrations is empty"
              echo "::error::they were never applied, or applied and never recorded"
              fail=1
            elif [ "$rowcount" -lt "$files" ]; then
              echo "::error::$schema.migrations has $rowcount rows for $files files in $dir"
              fail=1
            fi
          }
          check tw_world "$world_files" "$world_rows" core/sql/database_updates
          check tw_char  "$char_files"  "$char_rows"  core/sql/character_updates
          check tw_logon "$logon_files" "$logon_rows" core/sql/logon
          exit $fail

      - name: Assert the project tables landed in the schema that owns them
        run: |
          set -eu
          fail=0
          # ADR-0024 invariant 1 rests on these four tables and ADR-0021 puts
          # them in tw_char. They ship in
          # core/sql/character_updates/20260830230336_ai_playerbot_persistent_active_roster.sql.
          for t in ai_playerbot_roster_version ai_playerbot_roster_member \
                   ai_playerbot_roster_current ai_playerbot_roster_change; do
            found=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.TABLES
               WHERE TABLE_SCHEMA='tw_char' AND TABLE_NAME='$t';")
            if [ "$found" != "1" ]; then
              echo "::error::tw_char.$t is missing after bootstrap"
              echo "::error::the persistent roster cannot load (ADR-0024 invariant 1)"
              fail=1
            fi
          done
          # Invariant 2: nothing project-owned may be created in an upstream
          # schema. tw_world is upstream's; the roster is not world data.
          stray=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM information_schema.TABLES
             WHERE TABLE_SCHEMA='tw_world' AND TABLE_NAME LIKE 'ai_playerbot_roster%';")
          if [ "$stray" != "0" ]; then
            echo "::error::$stray roster tables were created in tw_world (ADR-0024 invariant 2)"
            fail=1
          fi
          exit $fail

      - name: Assert the realm is actually reachable
        run: |
          set -eu
          # Two columns decide whether a client gets past the login server:
          # port must equal WorldServerPort, and realmflags must be 0 (2 means
          # offline). A realmlist row with the wrong values looks fine in the
          # database and hangs the client before character select.
          bad=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM tw_logon.realmlist
             WHERE port <> $WORLD_PORT OR realmflags <> 0;")
          [ "$bad" = "0" ] || { echo "::error::$bad realmlist rows have the wrong port or realmflags"; exit 1; }
          rows=$(mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM tw_logon.realmlist;")
          [ "$rows" -gt 0 ] || { echo "::error::tw_logon.realmlist is empty - no realm to log into"; exit 1; }
          echo "realmlist rows: $rows"

      - name: Dump the ledger for the record
        if: always()
        run: |
          mkdir -p integration-results
          for schema in tw_logon tw_char tw_world; do
            mariadb -h "$DB_HOST" -P "$DB_PORT" -u root -B "$schema" \
              -e "SELECT \`Id\`,\`Name\`,\`Hash\`,\`AppliedAt\` FROM \`migrations\` ORDER BY \`Id\`;" \
              > "integration-results/$schema-migrations.tsv" 2>&1 || true
          done
          ls -la integration-results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-ledger
          path: integration-results/
          if-no-files-found: warn

  # ---------------------------------------------------------------- windows
  #
  # DISABLED 2026-09-02. Deliberate and temporary - not neglect, not rot.
  #
  # The decision (ADR-0028, "Windows CI disabled 2026-09-02"): Linux is what this
  # project deploys, so Windows CI comes out until it can actually run. The code
  # keeps every bit of its Windows support - dep/windows/lib, mangosd.ico, TW_PI,
  # the strtok_r shim, the _WIN32 branches and ops/windows/** are all untouched.
  # This is a CI configuration change and nothing else.
  #
  # Why it is safe to switch off: THIS JOB HAS NEVER SUCCESSFULLY RUN. Verified
  # across the last 25 ci.yml runs - every one of them shows `msvc compile-only:
  # failure` with ZERO steps executed, completing about two seconds after it
  # started. That is the signature of a job that never got a runner, not of a
  # compile that broke. Removing it deletes no coverage, because it never
  # produced any.
  #
  # Every other GitHub-HOSTED job fails the same way on every branch except
  # agent-k/ci-self-hosted, which moved the Linux jobs to `self-hosted` and is
  # the only branch with green runs. Two explanations for the hosted-runner
  # blackout are on record and this change does not depend on which is right:
  # the owner states twow-repo is private and gets no hosted runners on this
  # plan; the comment on this job in agent-k/ci-self-hosted attributes it to
  # blocked hosted billing. Either way the effect is the same and Windows is the
  # one job with no self-hosted runner to move to.
  #
  # Nothing `needs:` this job; `smoke` is the only job with a dependency and it
  # depends on `build-and-test`.
  #
  # NOTE, because it is a real disagreement and not an oversight: the comment on
  # agent-k/ci-self-hosted argues this job should stay visibly red rather than be
  # silenced, so that a green run never implies MSVC was checked. That reasoning
  # is sound and the owner overrode it deliberately - "we do mainly linux anyway".
  # The visibility it was protecting now lives in ADR-0028 and in this comment
  # instead of in a red X.
  #
  # HOW TO RE-ENABLE. One of two things has to change first:
  #   * a Windows runner becomes available (a self-hosted `windows-2022` runner
  #     joins, alongside the self-hosted Linux `k8s-twow-repo` runner), or
  #   * twow-repo becomes public, which restores GitHub-hosted runners.
  # Then either flip the `if:` below off, or run the workflow from the Actions
  # tab with `run_windows_compile` checked to try it once without committing.
  #
  # It is GATED rather than deleted on purpose. Deleting it would mean rebuilding
  # 190 lines of vcpkg/sccache cache plumbing and the reasoning below from git
  # archaeology when Windows CI comes back. Gating costs one skipped job entry per
  # run - a skipped job never requests a runner, so it costs nothing on a repo
  # with none.
  #
  # Everything below this line is the original job, unchanged, and still true.
  #
  # COMPILE ONLY. Never links.
  #
  # Why it exists: MSVC rejects code gcc and clang accept. The forcing example is
  # M_PI - glibc's <math.h> defines it unconditionally, MSVC's only defines it
  # when _USE_MATH_DEFINES was set before <math.h> was first included. No Linux
  # job can ever catch that class of error.
  #
  # Why it does not link: a clean clone cannot link on Windows by design.
  # dep/windows/lib (import libraries) and src/mangosd/mangosd.ico are pinned
  # external inputs kept out of Git (ADR-0019). Compiling needs neither, because
  # dep/windows/include IS tracked and mangosd.rc is only added under if(WIN32)
  # at the mangosd target.
  #
  # So this job needs no secrets and no provisioning, which means it runs on pull
  # requests from forks. Per ADR-0028, Windows is a compile target only: Linux
  # containers are the deployment platform and there is no Windows full-link job.
  #
  # Note on triggers: build-windows.yml used to skip itself on docs-only pull
  # requests with a `paths:` filter. A path filter cannot be expressed per job in
  # a consolidated workflow without adding a sixth job to compute it, so this now
  # runs on every push. That is a deliberate trade: one MSVC compile is cheap
  # next to the four full Linux compiles this consolidation removed.
  #
  # WHY IT IS GATED OFF RATHER THAN LEFT RED (resolved 2026-09-02).
  #
  # This job is the ONLY MSVC coverage this repository has, and the branch that
  # introduced the self-hosted runner argued it should stay visibly red: the
  # self-hosted runner is Linux, there is no Windows runner to move it to, and a
  # job silently skipped means a green run that never checked MSVC.
  #
  # That argument was overridden by the owner in #160, and the reason it holds:
  # MSVC coverage moved. `twow-core` now carries its own Windows CI job and it
  # passes, so the compile that mattered is being run - just in the repository
  # that owns the code it compiles. `twow-repo` is Linux-only (ADR-0028), and a
  # permanently red job on a repository with no Windows runner trains people to
  # ignore red rather than to read it.
  #
  # So while this stays gated, the honest statement is: MSVC is checked in
  # twow-core, not here, and a green run here never implied otherwise.
  windows-compile:
    # The gate. `inputs` is null on push, pull_request and schedule, so this is
    # false everywhere except a workflow_dispatch that ticked the box.
    if: ${{ inputs.run_windows_compile }}
    runs-on: windows-2022
    name: msvc compile-only
    timeout-minutes: 90

    env:
      # Everything slow about this job was a cache miss.
      #
      # It measured 21-33 minutes with no compiler cache of any kind, and about
      # seven of those minutes were vcpkg building ACE from source - once for
      # Release and once for Debug - on every push, for a dependency that has
      # not moved in months. Two caches address that: a vcpkg binary cache for
      # the dependencies, and sccache (the ccache equivalent that understands
      # cl.exe) for the tree itself.
      #
      # Both live on disk and are carried by actions/cache rather than by
      # sccache's own GitHub backend, so neither depends on which cache-service
      # API a particular sccache release happens to speak.
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      # Written once and used twice: to install the packages, and to key their
      # cache. Spelling the list out in two places is how a cache outlives the
      # dependency set it was built for and starts handing back the wrong ACE.
      VCPKG_TRIPLET: x64-windows
      VCPKG_PACKAGES: ace boost-thread boost-filesystem boost-system boost-stacktrace

    steps:
      # Insurance. Checkout used to die with "Filename too long": that is Git's
      # own 260-character MAX_PATH limit, not a filesystem limit. The offending
      # paths have been removed (the longest tracked path is now 190 characters),
      # but one new deep path would break every Windows run again and this costs
      # nothing. It must precede checkout - core.longpaths is read when the
      # working tree is written.
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Ninja makes every object file an addressable target, which is what lets
      # us compile without ever asking for a link. The Visual Studio generator
      # cannot do this, and also ignores compiler launchers.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      # What the two caches are keyed on, written to one file so hashFiles() can
      # key on all of it at once.
      #
      # The compiler has to be in the key. An object file produced by a
      # different MSVC toolset is not a cache miss, it is a wrong answer, and
      # because this job never links it is an answer that would go unnoticed
      # here and surface in somebody else's build. VCToolsVersion is exactly
      # that toolset's build number and msvc-dev-cmd exports it; asking cl.exe
      # for its banner instead would mean capturing a native command's stderr,
      # which PowerShell 5.1 turns into an error record.
      - name: Record what the caches are keyed on
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci, $env:SCCACHE_DIR, $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $toolset = if ($env:VCToolsVersion) { $env:VCToolsVersion } else { 'unknown-toolset' }
          $sdk = if ($env:WindowsSDKVersion) { $env:WindowsSDKVersion } else { 'unknown-sdk' }
          $vcpkgVersion = (vcpkg version) -join ' '
          @(
            "toolset=$toolset"
            "sdk=$sdk"
            "vcpkg=$vcpkgVersion"
            "triplet=$env:VCPKG_TRIPLET"
            "packages=$env:VCPKG_PACKAGES"
          ) | Set-Content -Encoding utf8 .ci/msvc-cache-key.txt
          Get-Content .ci/msvc-cache-key.txt

      # No run-id suffix and no restore-keys: a vcpkg binary package is either
      # the one this exact toolset and package list asked for or it is useless,
      # so an inexact hit would only mean rebuilding ACE with extra steps. On an
      # exact hit actions/cache skips the save, which is why this entry does not
      # grow on every push.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: msvc-vcpkg-${{ hashFiles('.ci/msvc-cache-key.txt') }}

      # sccache is the opposite case: a partial hit is most of the win, because
      # a push changes a handful of translation units out of the whole tree.
      # Hence the run-id suffix, so every run writes a fresh entry, plus a
      # prefix restore-key, so every run starts from the newest previous one.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: msvc-sccache-${{ hashFiles('.ci/msvc-cache-key.txt') }}-${{ github.run_id }}
          restore-keys: |
            msvc-sccache-${{ hashFiles('.ci/msvc-cache-key.txt') }}-

      # VCPKG_DEFAULT_BINARY_CACHE above is all that is needed: vcpkg's binary
      # caching is on by default and writes there. The packages come from the
      # same VCPKG_PACKAGES the cache key was built from, so the two cannot
      # disagree about what is in the cache.
      - name: Fetch ACE and Boost
        shell: pwsh
        run: |
          $pkgs = ($env:VCPKG_PACKAGES -split ' +') | ForEach-Object { $_ + ':' + $env:VCPKG_TRIPLET }
          Write-Host "vcpkg install $($pkgs -join ' ')"
          vcpkg install @pkgs

      # Two flags here exist only because of sccache, and both are acceptable
      # only because this job never links and never ships what it produces:
      #
      #   USE_PCH=OFF - sccache declines to cache any translation unit compiled
      #     with /Yu, so with precompiled headers left on it would cache nothing
      #     at all and the rest of this would be theatre.
      #   MSVC_SEPARATE_PDB=OFF - /Zi makes the compiler emit a second output
      #     file beside the object, which sccache also declines to cache. A
      #     compile-only job has no use for a .pdb.
      #
      # The honest cost: with PCH off a COLD cache compiles slower than this job
      # did before, because the precompiled header was buying real time. The bet
      # is that on a push-triggered job the warm cache is the common case and a
      # near-total hit rate beats a precompiled header on every run but the
      # first. If cold runs turn out to be normal - eviction, a toolset bump
      # every week - this trade is the wrong way round and should be revisited.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DUSE_PCH=OFF `
            -DMSVC_SEPARATE_PDB=OFF

      # Build the object files for the libraries, never the executables. If a
      # target name changes, this fails loudly rather than silently covering
      # nothing.
      - name: Compile objects (no link)
        shell: pwsh
        run: cmake --build build --target shared framework game --parallel

      # Printed whatever happened. A hit rate near zero here means one of the
      # two flags above stopped doing its job: the run would still be green,
      # just slow again, and this line is the only thing that would say so.
      - name: sccache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Confirm objects were produced
        shell: pwsh
        run: |
          $objs = Get-ChildItem build -Recurse -Filter *.obj -ErrorAction SilentlyContinue
          if ($objs.Count -lt 100) {
            Write-Error "Expected many .obj files, found $($objs.Count) - the compile step covered nothing"
            exit 1
          }
          Write-Host "Compiled $($objs.Count) object files"

  # ---------------------------------------------------------------- build+test
  #
  # The compile, the tests, and the image, out of ONE build tree.
  #
  # THE COMPILE USED TO HAPPEN TWICE. This job measured 77 minutes, 71 of them
  # in `Build the core image`, while the ccache on the runner reported "Hits:
  # 128/128 (100%)" - because that cache only ever covered the small test-target
  # build. The Docker build recompiled all ~1200 translation units from scratch
  # every single run, for the reason the old comment on that step already gave:
  # the Dockerfile's ccache is a BuildKit cache mount and type=gha does not
  # export cache mounts. So a run compiled the tree twice, once warm and once
  # cold, and paid for the cold one.
  #
  # Now there is one compile. It happens on the runner, in a container made from
  # Dockerfile.core's `builder-base` stage, and the image is assembled from what
  # it installed.
  #
  # WHY A CONTAINER AND NOT JUST THE RUNNER. The runner is Ubuntu 24.04 and the
  # image is Debian trixie, and the two disagree about the libraries the server
  # links hardest against: ACE is 7.1.3 on noble and 8.0.2 on trixie, and
  # default-libmysqlclient-dev resolves to libmysqlclient.so.21 on one and
  # libmariadb.so.3 on the other. Binaries built on the runner would copy into
  # the image perfectly and then fail to exec. Building in `builder-base` means
  # the same Debian, the same gcc and the same sonames as the release image,
  # with the ccache bind-mounted out to an ordinary directory that actions/cache
  # can carry between runs - which is the one thing a BuildKit cache mount could
  # not do. ops/ci/in-builder.sh holds the mounts and explains each one.
  #
  # WHAT THIS RUN STILL VERIFIES:
  #   * the whole tree compiles and links on the Debian that ships it, with
  #     MODULES=static and TW_ARCH=x86-64-v2, exactly as Dockerfile.core's
  #     builder stage would have configured it;
  #   * `cmake --install` produces a complete prefix, and the binaries in the
  #     resulting image start - the verify step below runs ldd inside the image,
  #     so a missing or mismatched shared library is caught here and not in the
  #     smoke job's logs;
  #   * the runtime image itself: same base, same apt list, same entrypoint,
  #     same user and directories, because `ci-staged` and `runtime` are the
  #     same `runtime-base` stage with a different source for ${PREFIX}.
  #
  # WHAT THIS RUN NO LONGER VERIFIES: that `docker build --target runtime`
  # works from source. The COPY . /src, the in-Dockerfile configure and the
  # in-Dockerfile build are not exercised on a push any more, so a change that
  # breaks only them - a .dockerignore entry that removes a needed file, a
  # build-arg default, an apt package the builder stage needs - would get past
  # this pipeline. publish.yml builds `--target runtime` from source on every
  # push to main and every tag, so nothing is ever released without that path
  # having worked, and nightly.yml compiles the same tree from a clean checkout
  # twice (clang and all-features-off) so a source-level break is found within a
  # day. Be precise about where the hole is: a Dockerfile-only change made on a
  # topic branch is not proven by this pipeline. It is proven the moment it
  # merges, by publish.yml, which is the last gate before a registry push -
  # that is the trade, and it is a Dockerfile edit's author who should know it.
  #
  # Ordering: configure and header contracts first, then the complete default
  # build graph, then every registered CTest plus the disposable-DB adapter.
  # Building the graph before CTest prevents a green subset caused by a missing
  # or forgotten hand-maintained test-target list.
  build-and-test:
    needs: capacity
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: build + test
    permissions:
      contents: read
      # Only this job, and only to DELETE its own superseded compiler caches -
      # see the prune step at the end. The workflow-level default stays
      # read-only; widening it there would hand the same write to lint, smoke
      # and every other job that has no business with it.
      actions: write
    # A cold cache exceeded 120 minutes in run 115 and was killed before it
    # could save the cache, making the next run repeat the same cold build.
    timeout-minutes: 150

    env:
      # The toolchain container every compile step below runs in. Local to this
      # runner and never pushed.
      BUILDER_IMAGE: twow/core-builder:ci
      # The named docker volume holding the build tree. Spelled here as well as
      # defaulted in ops/ci/in-builder.sh so the two cannot drift: the workflow
      # is what removes it, the script is what mounts it, and a disagreement
      # would leave a multi-gigabyte volume behind on a shared daemon every run.
      BUILD_VOLUME: twow-build
      # This is a throwaway credential for the per-run container below. It is
      # passed by environment name and is never echoed or uploaded.
      MARIADB_ROOT_PASSWORD: ci-root
      CI_DB_CONTAINER: twow-ci-mariadb-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # Resolves $SUDO and prints which runner claimed the job. See the long
      # note on the same step in the lint job.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?}, ${RUNNER_ENVIRONMENT:-unknown})"
          echo "user   : $(id)"
          echo "jobs   : ${CI_BUILD_JOBS:-<unset>} pinned"
          # nproc and free report the NODE, not this job's cgroup - see the
          # env block at the top of this file. The cgroup files are the only
          # honest numbers, so print those and label the others as untrue.
          echo "nproc  : $(nproc 2>/dev/null || echo '?') <- NOT a limit, this is the node"
          memmax=$(cat /sys/fs/cgroup/memory.max 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
            || echo n/a)
          echo "mem.max: $memmax <- the real ceiling"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      # recursive, and it has to reach two levels: the server core is the core/
      # submodule (ADR-0020) and the core carries the Eluna engine as a
      # submodule of its own at core/src/modules/Eluna. Without this the build
      # stops at the root CMakeLists' FATAL_ERROR about an empty core/; with
      # only one level it stops at the core's own FATAL_ERROR about a missing
      # Eluna. `submodules: recursive` covers both.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow is fine for building; the revision header only needs HEAD.
          fetch-depth: 1

      # Moved ahead of the build rather than sitting just before the image step,
      # because the build tree is now on the runner's disk instead of inside
      # BuildKit and it is the biggest thing here: DEBUG_SYMBOLS defaults to ON,
      # which is a 2.0 GB mangosd before the five static module targets. The
      # runner ships with ~25 GB of toolchains this build never touches.
      # Without the room the run dies deep in the compile with "{standard
      # input}: Fatal error: <object>: No such file or directory", which is the
      # assembler failing to write, not a compile error. The runner's own
      # warning ("Free space left: 90 MB") is the only thing that says so, and
      # it scrolls past.
      #
      # df on both sides, so the next disk failure is diagnosable from the log.
      #
      # TWO BODIES, because the right answer differs by runner and this
      # pipeline has to work unchanged on both. RUNNER_ENVIRONMENT is set by
      # the runner itself to `github-hosted` or `self-hosted`, so the branch
      # needs no repository variable and cannot drift out of step with where
      # the job actually landed.
      #
      # On a HOSTED VM the original body is right and is kept verbatim: the
      # machine is destroyed after the job, the ~25 GB of preinstalled
      # toolchains are dead weight, and `docker image prune -af` costs nothing.
      #
      # On a SELF-HOSTED runner both halves of it are wrong. Those paths exist
      # only in the hosted VM image, so removing them frees nothing. And
      # `docker image prune -af` deletes EVERY image not attached to a running
      # container - on a shared daemon that is other tenants' images and every
      # base layer anything else was about to reuse, gone. What runs instead
      # touches only what this pipeline owns: its own two tags, its own exited
      # containers, dangling layers, and build cache older than a day.
      #
      # The self-hosted disk is shared, against a build tree carrying debug
      # symbols and a 2.0 GB mangosd. That is tight rather than comfortable,
      # which is why df is printed on both sides and why "Reclaim the build
      # tree" below still runs before the image is assembled.
      - name: Free runner disk
        run: |
          df -h .
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            # A hosted VM is destroyed after the job, so nothing here is shared
            # and the aggressive form is free. This is the original body,
            # unchanged, and it is what reclaims the ~25 GB of preinstalled
            # toolchains this build never touches.
            $SUDO rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                         /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            $SUDO docker image prune -af || true
          else
            # A self-hosted runner is shared and persistent. Remove only tags
            # and the named volume owned by this pipeline. Global container,
            # image or builder pruning could delete another tenant's cache.
            docker image rm -f "$CORE_IMAGE" "$BUILDER_IMAGE" 2>/dev/null || true
          fi
          # A build tree left by a run that died before its reclaim step. It is
          # removed rather than reused: the checkout is fresh, so the tree would
          # be reconfigured from scratch anyway, and a stale one is only a
          # multi-gigabyte hold on a shared daemon's disk.
          docker volume rm -f "$BUILD_VOLUME" 2>/dev/null || true
          df -h .

      - uses: docker/setup-buildx-action@v3

      # THE cache. This is the one that matters now: it covers the whole tree,
      # not the handful of test translation units the old ci-linux-gcc key
      # covered. A fresh entry per run plus a prefix restore-key is the standard
      # rolling-cache shape - every run starts from the newest previous one and
      # leaves its own behind.
      #
      # A whole-tree cache with debug symbols is large; ccache is told to
      # compress and to stay under 4G by ops/ci/in-builder.sh. The Actions cache
      # is a 10 GB LRU for the entire repository, so this will evict other
      # scopes, and that is the intended trade - nothing else in this repository
      # is worth 71 minutes.
      # RESTORE ONLY. The save is a separate step at the end of this job and it
      # runs only on the default branch. That asymmetry is the whole fix, and it
      # is worth explaining because the symptom pointed somewhere else entirely.
      #
      # GitHub scopes every cache to the ref that wrote it. A cache written on
      # refs/pull/183/merge cannot be read from refs/pull/184/merge - PR caches
      # are private to their PR. The ONE exception is the default branch: a
      # cache saved on main is readable by every branch and every PR.
      #
      # With actions/cache (restore+save) on every run, each PR wrote its own
      # 2 GB ccache that no other branch could ever read, and read nothing on
      # its first run. Measured: `Cache not found for input keys:
      # ci-trixie-gcc-33980977774, ci-trixie-gcc-` followed by
      # `Hits: 0 / 1517 (0.00%)` and a 67-minute build - while four 2 GB caches
      # sat in the repository, every one of them scoped to a pull request.
      #
      # Worse than useless: those private caches crowd the repository's shared
      # 10 GB LRU budget, evicting the only cache that could have helped anyone.
      # Three runs of one PR were enough to spend 6 GB of it.
      #
      # So: every run restores from main's cache, and only main writes one.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ci-trixie-gcc-${{ github.run_id }}
          restore-keys: |
            ci-trixie-gcc-

      # Just the apt layer of Dockerfile.core's builder: no source is copied
      # into this stage, so it is one `apt-get install` and about a minute.
      #
      # Deliberately NOT cached in the Actions cache. The whole repository gets
      # 10 GB of it and the ccache above is the only thing in this job worth
      # spending it on; exporting a gigabyte of Debian packages to buy back
      # sixty seconds would evict the cache that buys back an hour.
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: builder-base
          push: false
          load: true
          tags: ${{ env.BUILDER_IMAGE }}

      # THE BUDGET THAT ACTUALLY CONSTRAINS THE BUILD, and it is not the one
      # `df -h .` prints anywhere else in this job. That is the runner pod's
      # filesystem. The build tree lives on a named volume on the DOCKER
      # DAEMON's data root - a different disk, with a different amount of room -
      # and a 1,533-target build with debug symbols has to fit in it. Printed
      # rather than assumed, and placed here because it is the first step at
      # which BUILDER_IMAGE exists to run it with.
      - name: How much room the build tree actually has
        run: |
          docker system df || true
          docker run --rm --volume "$BUILD_VOLUME:/build" "$BUILDER_IMAGE" \
            df -h /build /tmp || true

      # ONE configure, and it is the release configuration plus the tests.
      #
      # Two settings changed when this became the configure the image is built
      # from. CMAKE_BUILD_TYPE is Release rather than RelWithDebInfo, and
      # MODULES is static rather than the CMakeLists default of disabled -
      # because those are what Dockerfile.core's builder stage passes, and an
      # image assembled from a differently configured tree would not be the
      # image. It also means the test targets are now compiled against the
      # configuration that ships, which the old split did not do.
      #
      # TW_ARCH is spelled out at the Dockerfile's default rather than left to
      # CMake's, so the two cannot drift. `native` would bake this runner's CPU
      # into the artefact (ADR-0028).
      #
      # -B /build, NOT /src/build. The build tree is a named docker volume on
      # the daemon's local disk; /src is a bind mount that on the self-hosted
      # runner is served over a network filesystem, and `ld` cannot write there
      # (it dies at its final close() with ESTALE - see the long note in
      # ops/ci/in-builder.sh). Sources may live on the network mount; the things
      # the linker writes may not.
      - name: Configure
        run: |
          bash ops/ci/in-builder.sh 'cmake -S /src -B /build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/turtle \
            -DTW_ARCH=x86-64-v2 \
            -DMODULES=static \
            -DBUILD_TESTING=ON \
            -DBUILD_PERSISTENT_ROSTER_ADAPTER_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

      # Headers that use a type without declaring it compile fine until a
      # translation unit reaches them before the declaration -- and then the
      # errors point at a header that file never touched. Four landed in one
      # afternoon, each found by the Windows job twelve minutes at a time,
      # because GCC's include order here happens to be luckier than MSVC's.
      # Checked against a baseline, so this fails on a NEW one only.
      #
      # Runs off the configure above and compiles nothing but one-line probes,
      # so it reports before the long build starts. It used to cost four minutes
      # doing 216 of them one after another; the script now runs them nproc at a
      # time and collates the results in sorted order, so the report is
      # unchanged and the wall time is roughly a quarter of it.
      #
      # In the container because compile_commands.json names container paths and
      # the flags in it are trixie's include paths, not the runner's.
      #
      # The probe fan-out is capped by CI_BUILD_JOBS, which in-builder.sh
      # forwards into the container - so this call site does not have to pass it
      # and, more to the point, cannot forget to. Uncapped, the script falls
      # back to nproc and starts 20 concurrent -fsyntax-only compiles over the
      # game headers: the same memory budget the full build has, spent on a
      # check that should take a minute.
      - name: Core headers are self-contained
        run: bash ops/ci/in-builder.sh 'bash ops/audit/header-self-containment.sh /build'

      # Build CMake's complete default target once. Every normal executable
      # registered with add_test() belongs to that graph, so this replaces the
      # incomplete hand-maintained target list. The following inventory reads
      # CTest's generated JSON and fails if any registered executable is absent.
      - name: Build the server and all registered test executables
        run: |
          bash ops/ci/in-builder.sh \
            "cmake --build /build --parallel $CI_BUILD_JOBS"

      - name: Inventory registered tests and built executables
        id: testbuild
        run: |
          set -eu
          summary=$(bash ops/ci/in-builder.sh \
            'python3 ops/ci/registered-tests.py inventory /build')
          printf '%s\n' "$summary"
          registered=$(printf '%s\n' "$summary" | sed -n 's/^registered=//p')
          built=$(printf '%s\n' "$summary" | sed -n 's/^executable_targets=//p')
          missing=$(printf '%s\n' "$summary" | sed -n 's/^missing_executables=//p')
          {
            echo "registered=${registered:-0}"
            echo "built=${built:-0}"
            echo "missing=${missing:-0}"
          } >> "$GITHUB_OUTPUT"

      # Start a run-unique database explicitly after the capacity gate and the
      # compile. GitHub service containers start before step 1, which prevents
      # an early disk gate, and their host port is ambiguous on remote-docker.
      - name: Start the disposable adapter database
        id: adapterdb
        run: |
          set -eu
          docker rm -f "$CI_DB_CONTAINER" 2>/dev/null || true
          docker run -d --name "$CI_DB_CONTAINER" \
            --env MARIADB_ROOT_PASSWORD \
            --publish 127.0.0.1::3306 \
            --health-cmd='healthcheck.sh --connect --innodb_initialized' \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            mariadb:11.8 >/dev/null
          health=starting
          for _ in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' "$CI_DB_CONTAINER")
            [ "$health" = healthy ] && break
            [ "$health" = unhealthy ] && break
            sleep 2
          done
          [ "$health" = healthy ] || {
            echo "::error::disposable MariaDB did not become healthy: $health"
            exit 1
          }
          endpoint=$(docker port "$CI_DB_CONTAINER" 3306/tcp | head -1)
          db_port=${endpoint##*:}
          bash ops/ci/validate-ci-db-port.sh "$db_port"
          docker exec --env MYSQL_PWD="$MARIADB_ROOT_PASSWORD" \
            "$CI_DB_CONTAINER" mariadb -u root \
            -e 'CREATE DATABASE roster_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;'
          echo "CI_DB_PORT=$db_port" >> "$GITHUB_ENV"
          echo "port=$db_port" >> "$GITHUB_OUTPUT"
          echo "disposable database ready on published port $db_port"

      # The adapter suite does not create its own schema; the roster migration
      # IS the schema. Applied twice on purpose - forward-only migrations must be
      # replay-safe (ADR-0024 invariant 3), and this is the cheapest place that
      # gets checked at all.
      - name: Apply the roster schema (twice, to prove replay safety)
        run: |
          set -eu
          mig=core/sql/character_updates/20260830230336_ai_playerbot_persistent_active_roster.sql
          # utf8mb4_bin, matching what the roster tables declare - a differently
          # collated schema is the "Illegal mix of collations" trap.
          for pass in 1 2; do
            echo "apply pass $pass"
            docker exec --env MYSQL_PWD="$MARIADB_ROOT_PASSWORD" -i \
              "$CI_DB_CONTAINER" mariadb -u root roster_ci < "$mig"
          done

      # The binary is a trixie binary, so it runs in the container. The database
      # publishes an ephemeral port on the remote daemon; in-builder.sh joins
      # that daemon's host network and receives the validated port explicitly.
      #
      # The existence check has to happen INSIDE the container now. The build
      # tree is a named volume, so `test -x build/adapter-bin/...` on the runner
      # would look at a path that no longer exists and report "not in this
      # configuration" for a binary that was built perfectly well - turning a
      # real test into a silent skip, which is the one outcome the gate below
      # exists to prevent.
      - name: Run the adapter suite
        id: adapter
        shell: bash
        run: |
          bin=/build/adapter-bin/persistent_active_roster_database_tests
          if ! bash ops/ci/in-builder.sh "test -x $bin"; then
            echo "::notice::$bin was not built - the adapter suite is not in this configuration"
            echo "ran=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p test-results
          log=test-results/persistent_active_roster_database_tests.log
          # The connection string is assembled inside the toolchain container,
          # so the disposable password value is never printed by Actions.
          set +e
          bash ops/ci/in-builder.sh \
            "$bin \"127.0.0.1;\${CI_DB_PORT};root;\${MARIADB_ROOT_PASSWORD};roster_ci\"" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          # STAGE=COMPLETE is printed only after the last scenario. Without this
          # check a crash halfway through could report success with most of the
          # assertions never reached.
          if ! grep -q 'STAGE=COMPLETE' "$log"; then
            echo "::error::the adapter suite did not reach STAGE=COMPLETE - it stopped early"
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "ran=1" >> "$GITHUB_OUTPUT"
          else
            echo "ran=0" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # Runs whether or not the adapter suite passed, so the discovery count is
      # always reported.
      - name: ctest
        if: always()
        id: ctest
        run: |
          set -u
          mkdir -p test-results
          set +e
          bash ops/ci/in-builder.sh \
            'ctest --test-dir /build --output-on-failure --output-junit /src/test-results/ctest.xml'
          ctest_rc=$?
          summary=$(bash ops/ci/in-builder.sh \
            'python3 ops/ci/registered-tests.py junit /src/test-results/ctest.xml' 2>&1)
          summary_rc=$?
          set -e
          printf '%s\n' "$summary"
          for key in executed passed failed skipped; do
            value=$(printf '%s\n' "$summary" | sed -n "s/^${key}=//p")
            echo "$key=${value:-0}" >> "$GITHUB_OUTPUT"
          done
          [ "$ctest_rc" -eq 0 ] && [ "$summary_rc" -eq 0 ]

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      # The gate. Every step above can be individually green while nothing was
      # actually verified; this step is what makes that impossible. A green run
      # that tested nothing is worse than a red one, because it gets believed.
      - name: Fail if nothing was tested
        if: always()
        env:
          REGISTERED_TESTS: ${{ steps.testbuild.outputs.registered }}
          CTEST_EXECUTED: ${{ steps.ctest.outputs.executed }}
          CTEST_PASSED: ${{ steps.ctest.outputs.passed }}
          ADAPTER_RAN: ${{ steps.adapter.outputs.ran }}
          TARGETS_BUILT: ${{ steps.testbuild.outputs.built }}
          TARGETS_MISSING: ${{ steps.testbuild.outputs.missing }}
        run: |
          set -eu
          echo "registered tests        : ${REGISTERED_TESTS:-0}"
          echo "test executables built  : ${TARGETS_BUILT:-0}"
          echo "test executables missing: ${TARGETS_MISSING:-0}"
          echo "ctest tests executed    : ${CTEST_EXECUTED:-0}"
          echo "ctest tests passed      : ${CTEST_PASSED:-0}"
          echo "adapter suite executed  : ${ADAPTER_RAN:-0}"
          [ "${REGISTERED_TESTS:-0}" -gt 0 ] || {
            echo "::error::CTest registered zero tests"
            exit 1
          }
          [ "${TARGETS_MISSING:-0}" -eq 0 ] || {
            echo "::error::one or more registered test executables were not built"
            exit 1
          }
          [ "${CTEST_EXECUTED:-0}" -eq "${REGISTERED_TESTS:-0}" ] || {
            echo "::error::CTest did not execute every registered test"
            exit 1
          }
          [ "${CTEST_PASSED:-0}" -eq "${CTEST_EXECUTED:-0}" ] || {
            echo "::error::not every executed CTest passed"
            exit 1
          }
          [ "${ADAPTER_RAN:-0}" -eq 1 ] || {
            echo "::error::the disposable database adapter suite did not complete"
            exit 1
          }

      # ------------------------------------------------------------- the image
      #
      # The server and tests were compiled together before CTest. Install that
      # already-built tree now. `cmake --install` writes to /opt/turtle inside the
      # container, which in-builder.sh has bind-mounted to ./stage on the
      # runner - the prefix must be the real one because it is compiled into the
      # binary as SYSCONFDIR, so a DESTDIR here would produce a server that
      # cannot find its own configs.
      #
      # ccache statistics are printed on purpose. If the hit rate collapses, the
      # cache key or the compile line moved and this step is back to being an
      # hour; that would still be green, and this line is the only warning.
      #
      # --parallel is CI_BUILD_JOBS rather than nproc. See the workflow env
      # block for the arithmetic: the pod shows 20 cores and has ~9.2 GiB free,
      # and 20 concurrent compiles of this tree with debug symbols do not fit in
      # that. An OOM here does not print the words "out of memory" - it shows up
      # as ninja reporting a signal, or as the assembler failing to write an
      # object file, which reads exactly like running out of disk.
      - name: Stage the verified install
        run: |
          bash ops/ci/in-builder.sh "cmake --install /build \
            && ccache --show-stats"
          du -sh stage
          ls -la stage/bin

      # Only the default branch writes a cache, for the reason spelled out at the
      # restore step: a PR's cache is readable by nothing except that PR, so
      # writing one spends the shared budget to benefit a branch that is about to
      # be deleted.
      #
      # Deliberately NOT `if: always()`. A cache saved from a failed build can be
      # poisoned - a half-finished object tree that every later run then inherits
      # - and the whole point of this cache is that it is trusted without being
      # checked.
      #
      # Note the first main build after this lands is still cold, because there
      # is no main-scoped cache to inherit yet. It is the run that creates one.
      - name: Save the compiler cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ci-trixie-gcc-${{ github.run_id }}

      # Delete every OLDER compiler cache, keeping only the one just saved.
      #
      # Without this the cache is written but never reclaimed. The key carries
      # the run id so each push writes a NEW entry and the previous one is left
      # behind; at ~2 GB apiece against a repository-wide 10 GB budget, five
      # pushes are enough for the compiler caches alone to fill it. Measured
      # before this step existed: three ccache entries holding 6.08 GB of a
      # 7.31 GB total, with 28 buildkit blobs making up the rest.
      #
      # The symptom was not "the cache is full", it was "a warm build came out
      # cold": GitHub evicts least-recently-used, so main's newest entry was
      # being thrown out before the next run could restore it. Run 33988644479
      # logged `Cache not found for input keys: ci-trixie-gcc-...` followed by
      # `Hits: 0 / 1517 (0.00%)` and took 66 minutes, on a branch that was level
      # with main and had the restore/save split. Runs that DID find the cache
      # finished in 14.0 and 18.8 minutes.
      #
      # Deliberately after the save and gated on its success: deleting first
      # would leave a window with no cache at all, and deleting after a failed
      # save would throw away the only good copy for the sake of tidiness.
      #
      # `|| true` on the delete: a cache can vanish between the list and the
      # delete (another run's prune, or GitHub's own eviction), and losing a
      # race to delete something that is already gone is not a build failure.
      - name: Prune superseded compiler caches
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="ci-trixie-gcc-${{ github.run_id }}"
          echo "keeping $keep"

          # --paginate: the repository has dozens of small buildkit blobs and
          # the compiler caches are not guaranteed to be on the first page.
          stale=$(gh api --paginate "repos/${{ github.repository }}/actions/caches" \
                    --jq ".actions_caches[] | select(.key | startswith(\"ci-trixie-gcc-\")) | .key" \
                  | grep -vx "$keep" || true)

          if [ -z "$stale" ]; then
            echo "no superseded compiler caches"
            exit 0
          fi

          echo "$stale" | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "deleting $key"
            gh cache delete "$key" --repo "${{ github.repository }}" || true
          done

          gh api "repos/${{ github.repository }}/actions/cache/usage" \
            --jq '"cache usage now: \(.active_caches_size_in_bytes/1073741824*100|floor/100)GB across \(.active_caches_count) entries"'

      - name: Remove the disposable adapter database
        if: always()
        run: docker rm -f "$CI_DB_CONTAINER" 2>/dev/null || true

      # The build tree is the largest thing on the disk and nothing after this
      # reads it. Removing it before the image build leaves room for the context
      # transfer and for `docker save`.
      #
      # It is a named volume now, so `rm -rf build` on the runner would remove
      # nothing and quietly leave the space occupied. The volume is emptied
      # from inside a container instead, and then removed outright - a build
      # tree that survived into the next run would only be reconfigured from
      # scratch anyway (checkout wipes the source tree), so keeping it buys
      # nothing and costs the daemon's disk, which is shared.
      - name: Reclaim the build tree
        if: always()
        run: |
          df -h .
          if docker image inspect "$BUILDER_IMAGE" >/dev/null 2>&1; then
            docker run --rm --user 0:0 --volume "${BUILD_VOLUME:-twow-build}:/build" \
              "$BUILDER_IMAGE" sh -c 'du -sh /build 2>/dev/null; rm -rf /build/* /build/.[!.]* || true'
          fi
          docker volume rm -f "${BUILD_VOLUME:-twow-build}" || true
          df -h .

      - name: Record post-build capacity
        if: always()
        run: |
          echo "runner workspace after build:"
          df -h .
          echo "Docker data root after build:"
          docker run --rm --pull=missing alpine:3.22 df -h / || true
          docker system df || true

      # `ci-staged` is `runtime-base` plus a COPY of ./stage - the same base
      # image, apt list, entrypoint, user and directory layout as the `runtime`
      # target publish.yml ships. See the long comment at the top of this job
      # for what that does and does not prove.
      - name: Assemble the core image from the staged install
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: ci-staged
          push: false
          # Loaded into the local docker daemon so the next steps can inspect it
          # and `docker save` it for the smoke job.
          load: true
          tags: ${{ env.CORE_IMAGE }}
          # No cache-to for the same reason as the toolchain image, and one
          # sharper one: the only substantial layer here is the COPY of the
          # staged install, which is 2.5 GB and different on every run by
          # definition. Exporting that to the Actions cache would push a fresh
          # multi-gigabyte entry per push and evict everything else in the
          # repository to cache something that can never be hit.

      # What build-linux.yml's `test -x` used to assert, asserted against the
      # image that would be shipped - and then one step further.
      #
      # The ldd check is new and it is the guard on the whole staged-install
      # approach: the binaries are compiled in `builder-base` and run in
      # `runtime-base`, two different images, and the only thing that keeps them
      # compatible is that both are the same Debian release. If that ever stops
      # being true, ldd prints "not found" here rather than the smoke job timing
      # out on a container that exits instantly.
      - name: Verify the binaries are in the image
        run: |
          docker run --rm --entrypoint /bin/sh "$CORE_IMAGE" -c '
            set -eu
            test -x /opt/turtle/bin/mangosd
            test -x /opt/turtle/bin/realmd
            module_dir=/opt/turtle/etc/modules
            module_dist="$module_dir/mod_bot_brain.conf.dist"
            module_conf="${module_dist%.dist}"
            test -d "$module_dir"
            test -f "$module_dist"
            test "$(stat -c %u "$module_dir")" = 10001
            test ! -e "$module_conf"
            cp "$module_dist" "$module_conf"
            cmp "$module_dist" "$module_conf"
            rm "$module_conf"
            ls -la /opt/turtle/bin
            missing=0
            for b in /opt/turtle/bin/mangosd /opt/turtle/bin/realmd; do
              echo "--- ldd $b"
              ldd "$b" || true
              if ldd "$b" | grep -q "not found"; then
                echo "::error::$b has unresolved shared libraries in the runtime image"
                missing=1
              fi
            done
            exit $missing'

      # WHY AN ARTIFACT AND NOT A SHARED BUILD CACHE.
      #
      # The alternative was to let smoke run its own `docker build` with
      # cache-from: type=gha. That is not reliable. The Actions cache is a 10 GB
      # LRU shared with every other scope in the repository, and a miss there
      # does not cost seconds, it silently costs a second full compile inside
      # smoke, which is precisely the failure this consolidation exists to
      # remove. Worse, it fails quietly: the job still goes green, just an hour
      # later.
      #
      # A tar is deterministic. Smoke either loads the exact image this job
      # built, or it has nothing to load and says so. gzip -1 because the layers
      # are already compressed and upload bandwidth, not ratio, is the cost;
      # compression-level: 0 stops the upload action re-zipping it for nothing.
      - name: Export the image for the smoke job
        run: |
          set -eu
          mkdir -p image
          docker save "$CORE_IMAGE" | gzip -1 > image/core.tar.gz
          ls -lh image/core.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: core-image
          path: image/core.tar.gz
          # One day is plenty: its only consumer is the smoke job in this run.
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # ---------------------------------------------------------------- smoke
  #
  # Is it alive, and did it keep the bots?
  #
  # Brings the stack up and runs test/smoke/ - the same scripts a developer runs
  # locally against their own compose stack. They are not duplicated here on
  # purpose: a red CI smoke has to reproduce with one command, so this job only
  # supplies the stack and the environment.
  #
  # It no longer builds anything. It loads the image build-and-test produced,
  # tagged exactly as docker-compose.yml resolves by default, so `compose up`
  # finds it locally and neither builds nor pulls.
  #
  # WHAT THIS RUN CAN AND CANNOT PROVE.
  #
  # Client data is not here. dbc/maps/vmaps/mmaps come out of a retail client and
  # are never in an image or in Git (ADR-0023, ADR-0004), so mangosd cannot load a
  # single map and is not started at all. Every check that needs a running world
  # SKIPS with an explicit message; realmd and the migration ledger still run.
  # run-all.sh fails if *everything* skipped, so this can never go green having
  # proved nothing.
  #
  # That does mean the ADR-0024 invariant-1 bot-persistence check does not run
  # here. It runs wherever client data is mounted - a developer machine, or a
  # staging host - and its absence is printed in the summary rather than hidden.
  # Until this project has a runner with client data, invariant 1 is enforced by
  # people running `sh test/smoke/30-bot-persistence.sh`, and that is a gap worth
  # naming rather than papering over.
  smoke:
    needs: build-and-test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    name: compose up + smoke
    # Minutes, not hours: the compile already happened upstream in the DAG. The
    # old 150-minute budget existed only to cover `up --build`.
    timeout-minutes: 45

    env:
      TWOW_COMPOSE_FILE: deploy/compose/docker-compose.yml
      TWOW_ENV_FILE: deploy/compose/.env
      TWOW_DB_PASSWORD: ci-root

    steps:
      # Resolves $SUDO and prints which runner claimed the job. See the long
      # note on the same step in the lint job.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?}, ${RUNNER_ENVIRONMENT:-unknown})"
          echo "user   : $(id)"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      # submodules: recursive is not needed by anything this job reads
      # (deploy/compose and test/smoke are both in this repository, and the
      # server comes from an image), but it is kept so that the workspace this
      # job checks out is the same shape as build-and-test's. On a self-hosted
      # runner both jobs can land in the SAME reused workspace directory, and a
      # non-recursive checkout there would deinitialise core/ underneath a
      # subsequent build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # WHAT A PREVIOUS RUN LEAVES BEHIND. The teardown at the bottom of this
      # job removes the stack and its volumes, but it only runs if the job got
      # that far - a cancelled run, a runner restart or an OOM kill leaves the
      # containers and, worse, the `db` named volume in place. On a hosted VM
      # that never mattered because the VM was destroyed. Here the next run
      # would inherit an already-bootstrapped database plus its /state stage
      # markers, and "the bootstrap works from empty" is precisely the thing
      # that must not be inherited: db-init would skip every stage and the
      # smoke suite would pass against last week's database.
      #
      # A leftover realmd also holds port 3724, so `compose up` would fail with
      # a port conflict that reads like a bug in the compose file.
      #
      # This needs the .env that the next step generates, so it is done with
      # `docker compose ... --project-name` free arguments only: the project
      # name is derived from the directory, which is stable, and `down` does not
      # need the env file to resolve variables when given -v --remove-orphans
      # against an existing project. Falling back to a project-label sweep
      # keeps it working even if the compose file cannot be parsed at all.
      - name: Reclaim state a previous run may have left
        run: |
          set -eu
          proj="$(basename "$PWD" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')"
          echo "compose project: $proj"
          docker compose -p "$proj" down -v --remove-orphans || true
          docker ps -aq --filter "label=com.docker.compose.project=$proj" \
            | xargs -r docker rm -f
          docker volume ls
          $SUDO rm -rf /state || true

      # deploy/compose is the contract for the Helm chart and the publish
      # pipeline (ADR-0023). If it is missing, this job has nothing to smoke and
      # says so plainly rather than passing an empty run.
      - name: Require the compose stack
        run: |
          set -eu
          for f in "$TWOW_COMPOSE_FILE" deploy/compose/.env.example \
                   deploy/compose/render-config.sh deploy/compose/verify-config.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist - the stack cannot be brought up (ADR-0023)"
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: core-image
          path: image

      - name: Load the image this run built
        run: |
          set -eu
          gzip -dc image/core.tar.gz | docker load
          # If this tag is absent, `compose up` would fall back to building the
          # image itself - a silent 25-minute compile and exactly the regression
          # this DAG exists to prevent. Fail loudly instead.
          docker image inspect "$CORE_IMAGE" >/dev/null \
            || { echo "::error::$CORE_IMAGE is not present after load"; exit 1; }
          docker image ls "$CORE_IMAGE"

      # .env is gitignored by design: it holds the credentials the whole stack
      # runs on, and the compose file declares them with `:?` so it does not
      # even parse without them. CI generates a throwaway one from the example
      # so the same file the operator edits is the file being validated.
      - name: Generate a throwaway .env
        run: |
          set -eu
          sed -e 's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-root/' \
              -e 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-app/' \
              deploy/compose/.env.example > "$TWOW_ENV_FILE"
          docker compose -f "$TWOW_COMPOSE_FILE" --env-file "$TWOW_ENV_FILE" config >/dev/null
          echo "compose config parses"

      # The server has no environment-variable substitution - it reads a flat
      # file - so the configs must be rendered before anything starts.
      - name: Render server configs
        run: |
          set -a
          # shellcheck disable=SC1090
          . "./$TWOW_ENV_FILE"
          set +a
          bash deploy/compose/render-config.sh
          bash deploy/compose/verify-config.sh

      # Only realmd. It pulls in db and db-init through depends_on (the latter
      # with service_completed_successfully), and mangosd is deliberately left
      # down: without client data it would sit in start_period for 900s and then
      # fail, turning a known limitation into a timeout.
      #
      # No --build: the image is already loaded and compose resolves the `image:`
      # key to it. --wait blocks on the health checks the compose file declares,
      # which is the only honest "it is up" signal; a fixed sleep would test the
      # sleep.
      - name: Start db, db-init and realmd
        run: |
          set -eu
          C="docker compose -f $TWOW_COMPOSE_FILE --env-file $TWOW_ENV_FILE"

          # Deliberately NOT `up --wait`. That flag waits for every container in
          # the dependency graph to be running or healthy, and db-init is a
          # one-shot that exits 0 when the bootstrap succeeds. An exited
          # container is neither, so --wait failed three seconds after a
          # perfectly successful bootstrap, with realmd still in health: starting
          # and 1798 of its 1800 seconds unused. The error read "the stack did
          # not become healthy", which is precisely backwards.
          #
          # Not a regression: the smoke job had been skipped in every previous
          # run because something upstream failed first, so its first real
          # execution was also its first failure.
          $C up -d realmd

          # db-init must have finished, and cleanly. Its exit code is the
          # bootstrap's verdict; read it rather than inferring from realmd.
          for _ in $(seq 1 300); do
            state=$($C ps -a --format '{{.Service}} {{.State}}' | awk '$1=="db-init"{print $2}')
            [ "$state" = "exited" ] && break
            sleep 2
          done
          rc=$(docker inspect -f '{{.State.ExitCode}}' "$($C ps -aq db-init)")
          [ "$rc" = "0" ] || { echo "::error::db-init exited $rc - the bootstrap failed"; exit 1; }

          # Then poll realmd's own health check, the only honest "it is up"
          # signal. A fixed sleep would test the sleep.
          h=starting
          for _ in $(seq 1 300); do
            h=$(docker inspect -f '{{.State.Health.Status}}' "$($C ps -aq realmd)" 2>/dev/null || echo starting)
            [ "$h" = "healthy" ] && break
            [ "$h" = "unhealthy" ] && { echo "::error::realmd reported unhealthy"; exit 1; }
            sleep 2
          done
          [ "$h" = "healthy" ] || { echo "::error::realmd did not become healthy within 600s"; exit 1; }

          $C ps -a

      - name: Run the smoke suite
        env:
          # Explicit rather than probed: mangosd is not running, and the suite
          # must skip the world-server checks for a stated reason rather than
          # because a probe happened to fail.
          TWOW_CLIENT_DATA: '0'
        run: sh test/smoke/run-all.sh

      # Logs are the only way to diagnose a failed stack after the fact, so they
      # are collected whatever happened. db-init's log in particular is where a
      # bootstrap failure explains itself.
      - name: Collect logs
        if: always()
        run: |
          mkdir -p smoke-logs
          C="docker compose -f $TWOW_COMPOSE_FILE --env-file $TWOW_ENV_FILE"
          $C ps -a > smoke-logs/ps.txt 2>&1 || true
          $C logs --no-color --timestamps > smoke-logs/compose.log 2>&1 || true
          $C logs --no-color --timestamps db-init > smoke-logs/db-init.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: warn

      # -v as well as down: a leftover volume would let the next run inherit a
      # bootstrapped database and its stage markers, and "the bootstrap works
      # from empty" is exactly what must not be inherited.
      - name: Tear down
        if: always()
        run: |
          docker compose -f "$TWOW_COMPOSE_FILE" --env-file "$TWOW_ENV_FILE" \
            down -v --remove-orphans || true
