# TEMPORARY verification workflow (Agent L).
#
# GitHub-hosted runners are billing-blocked, so ci.yml cannot report on anything
# today. This runs the same Linux compile on the self-hosted runner instead, so
# a change can be verified before it is merged. It deliberately does NOT touch
# ci.yml, which is being rewritten in parallel to move CI onto that runner.
#
# Delete this file once ci.yml runs on the self-hosted runner.
name: agent-l verify
on:
  workflow_dispatch:
  push:
    branches: [agent-l/verify-**]

jobs:
  build:
    runs-on: [self-hosted]
    name: linux build (self-hosted)
    timeout-minutes: 180
    env:
      BUILDER_IMAGE: twow/core-builder:agent-l
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Disk before
        run: |
          df -h / || true
          docker image prune -af || true
          df -h / || true

      - name: Toolchain image
        run: |
          docker build --target builder-base             -f deploy/docker/Dockerfile.core             -t twow/builder-base:agent-l .

      # Only the two module targets my PRs touch, at capped parallelism.
      # Rationale for both choices is in the Dockerfile.
      - name: Compile the touched modules
        run: |
          docker build             --build-arg BASE=twow/builder-base:agent-l             --build-arg JOBS=4             -f .github/agent-l-verify.Dockerfile             -t twow/agent-l-verify:latest .

      - name: Disk after
        if: always()
        run: df -h / || true
