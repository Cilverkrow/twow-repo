# Migrations, from empty, against a real MariaDB.
#
# This is where the migration path is proven. Nothing else in CI touches a
# database that was created five seconds earlier, and "it works on the live
# server" is not evidence that a fresh install works at all.
#
# One thing here needs explaining, because it looks like duplication and is not.
# The `migrations` ledger is written by the server, not by the SQL: `sql/
# setup_databases.sh` applies files and records nothing, and
# `src/shared/Database/AutoUpdater.cpp` is what inserts (Name, Module, Hash,
# AppliedAt). Starting a real mangosd here is not an option - it needs client
# data, which is never in an image or in Git (ADR-0023) - so this job reproduces
# the AutoUpdater's bookkeeping exactly and says so:
#
#   Name = file stem                       (AutoUpdater.cpp, LoadFileMigrations)
#   Hash = SHA1 of the file bytes, UPPERCASE hex   (CalculateFileHash +
#                                                   ByteArrayToHexStr's "%02X")
#   order = sorted by name                 (Database.AutoUpdate.SortByName = 1)
#
# If AutoUpdater.cpp changes its hash or naming, this job must change with it.
# When deploy/compose gains a real db-init image, this should call that image
# instead and delete the replica.
name: integration

on:
  pull_request:
    # A full bootstrap is minutes of SQL, so on PRs it only runs when something
    # that can change the outcome moved.
    paths:
      - 'sql/**'
      - 'src/shared/Database/**'
      - 'deploy/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [main, 'refactor/**']
    paths:
      - 'sql/**'
      - 'src/shared/Database/**'
      - 'deploy/**'
      - '.github/workflows/integration.yml'
  # Nightly backstop. The PR trigger is path-filtered, so a bootstrap that
  # breaks for a reason outside sql/ would otherwise go unnoticed until release.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      load_base_data:
        description: 'Also load sql/base (131 MB of world data). Slow.'
        type: boolean
        default: false

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    name: bootstrap from empty
    timeout-minutes: 60

    services:
      # 11.8 LTS, pinned by ADR-0027: it is what the stack deploys, and older
      # MariaDB has different default collations, which INSTALL-LINUX.md already
      # documents as a source of "Illegal mix of collations".
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      MYSQL_PWD: ci-root
      DBHOST: 127.0.0.1
      DBPORT: '3306'
      # sql/base is 131 MB of world content. It is not needed to prove that the
      # migrations apply - only that they apply to populated tables - so it is
      # nightly and on-demand rather than on every PR.
      # Parenthesised deliberately: `&&` binds tighter than `||` in GitHub
      # expressions, so without them a scheduled run yields `true`, not `yes`.
      LOAD_BASE: ${{ (github.event_name == 'schedule' || inputs.load_base_data) && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client

      # The dump opens with a /*M!999999 ... */ sandbox directive that only the
      # MariaDB client understands, so `mariadb` is used throughout rather than
      # whichever `mysql` happens to be on the runner.
      - name: Confirm the database is empty
        run: |
          set -eu
          existing=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
            "SELECT COUNT(*) FROM information_schema.SCHEMATA
             WHERE SCHEMA_NAME IN ('tw_world','tw_char','tw_logon','tw_logs');")
          if [ "$existing" != "0" ]; then
            echo "::error::not starting from empty - $existing project schemas already exist"
            exit 1
          fi
          echo "starting from empty"

      - name: Create schemas and structure
        run: |
          set -eu
          time mariadb -h "$DBHOST" -P "$DBPORT" -u root < sql/create_databases.sql

      - name: Load sql/base world data
        if: env.LOAD_BASE == 'yes'
        run: |
          set -eu
          # 190 per-table mysqldump files. Applied in name order for a stable,
          # reproducible run; they are independent MyISAM tables with no foreign
          # keys, so order is presentation, not correctness.
          count=0
          for f in $(find sql/base -name '*.sql' | sort); do
            mariadb -h "$DBHOST" -P "$DBPORT" -u root tw_world < "$f"
            count=$((count + 1))
          done
          echo "loaded $count base table files"

      # The core of this job. Written as a reusable function because the replay
      # check below runs it a second time and must take exactly the same path.
      - name: Apply migrations and record the ledger
        run: |
          set -eu
          cat > /tmp/apply.sh <<'SH'
          set -eu
          # $1 = directory of migration files, $2 = target schema
          dir="$1"; schema="$2"
          applied=0; skipped=0
          [ -d "$dir" ] || { echo "no such directory: $dir"; exit 1; }
          for f in $(find "$dir" -maxdepth 1 -name '*.sql' | sort); do
            name=$(basename "$f" .sql)
            hash=$(sha1sum "$f" | cut -d' ' -f1 | tr 'a-f' 'A-F')
            # The AutoUpdater keys on (Module, Hash): a file already recorded is
            # skipped, never reapplied. Forward-only, replay-safe (ADR-0024
            # invariant 3).
            known=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B "$schema" \
              -e "SELECT COUNT(*) FROM \`migrations\` WHERE \`Hash\`='$hash' AND \`Module\`='';")
            if [ "$known" != "0" ]; then
              skipped=$((skipped + 1))
              continue
            fi
            if ! mariadb -h "$DBHOST" -P "$DBPORT" -u root "$schema" < "$f"; then
              echo "::error file=$f::migration failed to apply to $schema"
              exit 1
            fi
            mariadb -h "$DBHOST" -P "$DBPORT" -u root "$schema" -e \
              "INSERT INTO \`migrations\` (\`Name\`,\`Module\`,\`Hash\`,\`AppliedAt\`)
               VALUES ('$name','','$hash',NOW());"
            applied=$((applied + 1))
          done
          echo "$dir -> $schema: applied=$applied skipped=$skipped"
          SH
          chmod +x /tmp/apply.sh
          # The AutoUpdater's own order: logon, then char, then world.
          sh /tmp/apply.sh sql/logon             tw_logon
          sh /tmp/apply.sh sql/character_updates tw_char
          sh /tmp/apply.sh sql/database_updates  tw_world

      - name: Assert the schemas exist
        run: |
          set -eu
          for schema in tw_world tw_char tw_logon tw_logs; do
            found=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$schema';")
            [ "$found" = "1" ] || { echo "::error::schema $schema was not created"; exit 1; }
            tables=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$schema';")
            [ "$tables" -gt 0 ] || { echo "::error::schema $schema is empty"; exit 1; }
            echo "$schema: $tables tables"
          done

      - name: Assert the migrations ledger matches the files on disk
        run: |
          set -eu
          fail=0
          check() {
            dir="$1"; schema="$2"
            files=$(find "$dir" -maxdepth 1 -name '*.sql' | wc -l)
            rows=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B "$schema" \
              -e "SELECT COUNT(*) FROM \`migrations\`;")
            echo "$schema: $rows ledger rows for $files files in $dir"
            # A populated ledger is the point, and the count has to match: a
            # ledger with fewer rows than files means something applied without
            # being recorded, which is how a migration silently reapplies later.
            if [ "$rows" -eq 0 ]; then
              echo "::error::$schema.migrations is empty after bootstrap"
              fail=1
            elif [ "$rows" -ne "$files" ]; then
              echo "::error::$schema.migrations has $rows rows for $files migration files"
              fail=1
            fi
            # Invariant 3 again, from the other end: every recorded hash must be
            # a real 40-character SHA1. The literal 'manual' made 146 world
            # migrations unverifiable (OPS-012, FG-033) and must never recur.
            bad=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B "$schema" \
              -e "SELECT COUNT(*) FROM \`migrations\` WHERE \`Hash\` NOT REGEXP '^[0-9A-F]{40}\$';")
            if [ "$bad" != "0" ]; then
              echo "::error::$schema.migrations has $bad rows whose Hash is not a SHA1 digest"
              fail=1
            fi
          }
          check sql/logon             tw_logon
          check sql/character_updates tw_char
          check sql/database_updates  tw_world
          exit $fail

      - name: Assert the project tables landed in the schema that owns them
        run: |
          set -eu
          # The persistent roster is the concrete case: ADR-0024 invariant 1
          # rests on these four tables, and ADR-0021 puts them in tw_char.
          for t in ai_playerbot_roster_version ai_playerbot_roster_member \
                   ai_playerbot_roster_current ai_playerbot_roster_change; do
            found=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
              "SELECT COUNT(*) FROM information_schema.TABLES
               WHERE TABLE_SCHEMA='tw_char' AND TABLE_NAME='$t';")
            [ "$found" = "1" ] || { echo "::error::tw_char.$t is missing after bootstrap"; exit 1; }
          done
          # The singleton current pointer must exist and start unset. A roster
          # that arrives pre-pointed at a version nobody created is invariant 1
          # broken before the server has even started.
          row=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B tw_char -e \
            "SELECT COUNT(*) FROM \`ai_playerbot_roster_current\` WHERE \`singleton_id\`=1 AND \`version_id\` IS NULL;")
          if [ "$row" != "1" ]; then
            echo "::error::ai_playerbot_roster_current is not the expected empty singleton"
            exit 1
          fi
          echo "roster schema present and empty"

      # Invariant 3, end to end: a second bootstrap over the same database must
      # apply nothing and change nothing. This is what makes the ledger worth
      # having, and it is the check that would have caught OPS-012.
      - name: Replay the bootstrap and assert nothing reapplies
        run: |
          set -eu
          before=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
            "SELECT (SELECT COUNT(*) FROM tw_logon.migrations)
                  + (SELECT COUNT(*) FROM tw_char.migrations)
                  + (SELECT COUNT(*) FROM tw_world.migrations);")
          sh /tmp/apply.sh sql/logon             tw_logon
          sh /tmp/apply.sh sql/character_updates tw_char
          sh /tmp/apply.sh sql/database_updates  tw_world
          after=$(mariadb -h "$DBHOST" -P "$DBPORT" -u root -N -B -e \
            "SELECT (SELECT COUNT(*) FROM tw_logon.migrations)
                  + (SELECT COUNT(*) FROM tw_char.migrations)
                  + (SELECT COUNT(*) FROM tw_world.migrations);")
          echo "ledger rows before replay: $before, after: $after"
          if [ "$before" != "$after" ]; then
            echo "::error::replay applied $((after - before)) migrations again - not replay-safe"
            exit 1
          fi

      - name: Dump the ledger for the record
        if: always()
        run: |
          mkdir -p integration-results
          for schema in tw_logon tw_char tw_world; do
            mariadb -h "$DBHOST" -P "$DBPORT" -u root -B "$schema" \
              -e "SELECT \`Id\`,\`Name\`,\`Module\`,\`Hash\`,\`AppliedAt\` FROM \`migrations\` ORDER BY \`Id\`;" \
              > "integration-results/$schema-migrations.tsv" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-ledger
          path: integration-results/
          if-no-files-found: warn
