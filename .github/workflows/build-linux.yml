# Linux build - the complete gate.
#
# A clean clone builds fully on Linux and cannot on Windows: dep/windows/lib and
# src/mangosd/mangosd.ico are deliberately not in Git (ADR-0019). So Linux is
# where full-link coverage lives, and it works for pull requests from forks.
#
# See ADR-0028 for the platform decision.
name: build-linux

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow is fine for building; the revision header only needs HEAD.
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Only the Boost components actually linked (thread, filesystem,
          # system) plus headers. libboost-all-dev pulls ~230 packages
          # including OpenMPI and adds several minutes for nothing.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libace-dev default-libmysqlclient-dev \
            libssl-dev zlib1g-dev libbz2-dev \
            libboost-dev libboost-thread-dev libboost-filesystem-dev \
            libboost-system-dev libboost-stacktrace-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}
          max-size: 2G

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # TW_ARCH defaults to x86-64-v2 rather than the historical `native`,
          # so an artifact built here runs elsewhere.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/turtle \
            -DBUILD_PLAYERBOTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify binaries exist
        run: |
          test -x build/src/mangosd/mangosd
          test -x build/src/realmd/realmd
          ls -la build/src/mangosd/mangosd build/src/realmd/realmd

  # Invariant 4 (ADR-0024): the core must still build and run with every
  # project feature switched off. Cheapest possible guard against a module
  # that cannot be compiled out.
  no-modules:
    runs-on: ubuntu-24.04
    name: all features off
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libace-dev default-libmysqlclient-dev \
            libssl-dev zlib1g-dev libbz2-dev libboost-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-no-modules
          max-size: 2G
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/turtle \
            -DBUILD_PLAYERBOTS=OFF \
            -DMODULES=disabled \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"
          test -x build/src/mangosd/mangosd
