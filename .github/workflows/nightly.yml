# The slow-moving breakage.
#
# ci.yml answers "is this push broken?" and pays for exactly one full compile to
# do it. Three checks do not belong in that budget, because none of them can be
# broken by the push in front of you and all of them are expensive:
#
#   * the clang build - a second toolchain catching what gcc accepts. Real, but a
#     diagnostic that only clang emits will still be there tomorrow morning.
#   * the all-features-off build (ADR-0024 invariant 4). It is a whole second
#     compile of the core to prove a module can still be compiled out; the thing
#     it guards against is introduced by module work, not by every commit.
#   * upstream drift. Nothing in this repository changes it at all; it changes
#     when somebody else pushes to a repository we do not control.
#
# Running them here keeps the per-push pipeline at one compile while nothing is
# actually lost - the worst case is that one of these is found a day late, and
# workflow_dispatch exists for when a day is too long.
name: nightly

on:
  # 03:30 UTC: after the runners are quiet and before the working day, so a
  # failure is waiting in the morning rather than competing with pushes.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress: a nightly that gets cancelled by the next nightly
  # would simply never finish.
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Every job here is Linux, so every job here follows ci.yml onto the self-hosted
# runner while GitHub-hosted runners are billing-blocked. The full rationale, and
# the one-variable way back, are in the header of ci.yml: set the repository
# variable CI_RUNNER to `ubuntu-24.04` and all three workflows move at once.
env:
  # Same reasoning as ci.yml: ~9.2 GiB free on a 20-core shared pod, and the
  # heavy translation units in this tree peak at 1.5-2.5 GiB each. Both builds
  # below are FULL from-scratch compiles of the whole server, so this is the
  # job most likely to prove the pod cannot carry it.
  CI_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}

jobs:
  # A second toolchain. clang and gcc disagree about enough - unused-but-set
  # variables, out-of-line template definitions, the shadowing warnings - that a
  # tree building under only one of them is a tree that will surprise someone.
  clang:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    name: clang full build
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
    steps:
      # Resolves $SUDO and prints which runner claimed the job. The self-hosted
      # runner is usually root with no sudo binary, so a bare `sudo apt-get` is
      # a command-not-found there. See the long note in ci.yml's lint job.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          echo "jobs   : ${CI_BUILD_JOBS:-<unset>} of $(nproc 2>/dev/null || echo '?') cores"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      # recursive reaches two levels: core/ is the server core (ADR-0020) and it
      # carries Eluna as a submodule of its own. One level short of that and the
      # build dies in the core's FATAL_ERROR about a missing Eluna.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow is fine for building; the revision header only needs HEAD.
          fetch-depth: 1

      - name: Install dependencies
        run: |
          $SUDO apt-get update
          # `clang` is listed explicitly. It is preinstalled on the
          # ubuntu-24.04 hosted image and is NOT on the self-hosted runner, so
          # leaving it implicit made the whole point of this job - a second
          # toolchain - depend on which machine claimed it. Only the Boost
          # components actually linked (thread, filesystem, system) plus
          # headers: libboost-all-dev pulls ~230 packages including OpenMPI and
          # adds several minutes for nothing.
          $SUDO apt-get install -y --no-install-recommends \
            clang build-essential cmake ninja-build ccache \
            libace-dev default-libmysqlclient-dev \
            libssl-dev zlib1g-dev libbz2-dev \
            libboost-dev libboost-thread-dev libboost-filesystem-dev \
            libboost-system-dev libboost-stacktrace-dev
          clang --version

      # Its own cache key. Sharing gcc's would thrash both: ccache keys on the
      # compiler binary, so every object would miss on alternating runs.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nightly-clang
          max-size: 2G

      - name: Configure
        run: |
          # TW_ARCH defaults to x86-64-v2 rather than the historical `native`,
          # so a binary built here runs elsewhere (ADR-0028).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/turtle \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # CI_BUILD_JOBS, not nproc - see the env block at the top of this file.
      - name: Build
        run: cmake --build build --parallel "$CI_BUILD_JOBS"

      - name: Verify binaries exist
        run: |
          test -x build/src/mangosd/mangosd
          test -x build/src/realmd/realmd
          ls -la build/src/mangosd/mangosd build/src/realmd/realmd

  # Invariant 4 (ADR-0024): the core must still build and run with every project
  # feature switched off. Cheapest possible guard against a module that cannot be
  # compiled out - and the cheapest is still a full compile, which is why it is
  # here rather than on the push path.
  no-modules:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    name: all features off
    timeout-minutes: 120
    steps:
      # Resolves $SUDO and prints which runner claimed the job. The self-hosted
      # runner is usually root with no sudo binary, so a bare `sudo apt-get` is
      # a command-not-found there. See the long note in ci.yml's lint job.
      - name: Runner preflight
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
            echo "::warning::not root and no usable sudo - any step needing apt-get will fail"
          fi
          echo "SUDO=$SUDO" >> "$GITHUB_ENV"
          echo "runner : ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          echo "jobs   : ${CI_BUILD_JOBS:-<unset>} of $(nproc 2>/dev/null || echo '?') cores"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          $SUDO apt-get update
          # No thread/filesystem/system/stacktrace Boost runtimes here: with
          # every feature off, only the Boost headers are reached.
          $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libace-dev default-libmysqlclient-dev \
            libssl-dev zlib1g-dev libbz2-dev libboost-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nightly-no-modules
          max-size: 2G

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/turtle \
            -DMODULES=disabled \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$CI_BUILD_JOBS"
          test -x build/src/mangosd/mangosd

  # How far has upstream moved, and into which of our files?
  #
  # The repository's history was rewritten with git-filter-repo to strip binaries
  # (docs/PROVENANCE.md), so it shares no history with upstream and `git
  # merge-base` cannot be asked. ADR-0020 records the effective merge-base for
  # the Penqle line - db5fb2a - and ADR-0026 records the remote. Both are facts
  # written in prose and nowhere else; this job is what turns them into a number
  # somebody sees.
  #
  # It REPORTS, it does not fail. Upstream moving is not a defect in this branch,
  # and a red X that means "somebody else committed something" is a red X people
  # learn to ignore. The one thing it does fail on is being unable to reach
  # upstream at all, because a silently skipped drift check is worse than none.
  #
  # When ADR-0020's split lands and UPSTREAM.lock exists, the recorded base below
  # should be read from that file instead of being spelled here.
  upstream-drift:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    name: upstream drift
    timeout-minutes: 30
    env:
      UPSTREAM_URL: https://github.com/Shyalya/tortoise-wow.git
      UPSTREAM_BRANCH: playerbots-integration-gh
      # ADR-0026: the effective upstream merge-base for the Penqle line,
      # reachable only as 14d4cdc^2 and named nowhere else in the tree.
      UPSTREAM_BASE: db5fb2a197f05611ad9d243568122c6be466ab8a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch upstream and measure the drift
        run: |
          set -eu
          # UPSTREAM.lock is ADR-0020's home for these values, and it exists
          # now. It wins over the env defaults above so this job cannot
          # disagree with the pinned submodule. The defaults stay as a fallback
          # for a branch cut before the file landed.
          if [ -f UPSTREAM.lock ]; then
            . ./UPSTREAM.lock
            UPSTREAM_URL="${UPSTREAM_URL:?}"
            UPSTREAM_BRANCH="${UPSTREAM_BRANCH:?}"
            UPSTREAM_BASE="${UPSTREAM_BASE:?}"
            echo "read UPSTREAM.lock"

            # The gitlink in the tree is the authority on which core commit
            # this platform is pinned to; UPSTREAM.lock is the readable copy.
            # If the two disagree somebody moved the submodule without
            # recording it, and a tag stops reproducing its own build.
            # `rev-parse HEAD:core` reads the gitlink out of the tree object,
            # so this needs no submodule checkout.
            linked=$(git rev-parse HEAD:core 2>/dev/null || echo "")
            if [ -z "$linked" ]; then
              echo "::error::no gitlink at core/ - the submodule is not in the tree"
              exit 1
            elif [ "$linked" != "${CORE_COMMIT:-}" ]; then
              echo "::error::core/ gitlink is $linked but UPSTREAM.lock says ${CORE_COMMIT:-<unset>}"
              exit 1
            fi
            echo "core pin agrees  : $linked"
          fi

          # A bare mirror of the branch only. Cloning the working tree would pull
          # the 130 MB of world SQL for a commit count.
          git clone --bare --filter=blob:none --single-branch \
            --branch "$UPSTREAM_BRANCH" "$UPSTREAM_URL" upstream.git \
            || { echo "::error::cannot reach $UPSTREAM_URL - the drift check proved nothing"; exit 1; }

          tip=$(git -C upstream.git rev-parse HEAD)
          echo "upstream tip     : $tip"
          echo "recorded base    : $UPSTREAM_BASE"

          if ! git -C upstream.git cat-file -e "$UPSTREAM_BASE^{commit}" 2>/dev/null; then
            echo "::warning::$UPSTREAM_BASE is not reachable from $UPSTREAM_BRANCH."
            echo "::warning::Upstream was force-pushed or rebased, or the recorded base is wrong."
            echo "::warning::ADR-0020/ADR-0026 need re-checking before the next merge."
            exit 0
          fi

          if [ "$tip" = "$UPSTREAM_BASE" ]; then
            echo "::notice::upstream has not moved since the recorded merge-base"
            exit 0
          fi

          ahead=$(git -C upstream.git rev-list --count "$UPSTREAM_BASE..$tip")
          echo "::notice::upstream is $ahead commit(s) ahead of the recorded merge-base"

          # The files ADR-0020 measured as the expensive ones: the highest-traffic
          # upstream files are also the ones carrying the project's core delta, so
          # upstream touching them is what turns a merge into a conflict day.
          echo
          echo "Upstream changes in the files that carry our delta:"
          git -C upstream.git diff --stat "$UPSTREAM_BASE..$tip" -- \
            'src/game/Objects/Player.*' 'src/game/World/World.*' \
            'src/game/Objects/Unit.*' 'src/game/Server/WorldSession.cpp' \
            'src/game/Handlers/CharacterHandler.cpp' \
            || echo "  (none of the tracked hot files changed)"

          {
            echo "### Upstream drift"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| remote | \`$UPSTREAM_URL\` (\`$UPSTREAM_BRANCH\`) |"
            echo "| recorded base | \`$UPSTREAM_BASE\` |"
            echo "| upstream tip | \`$tip\` |"
            echo "| commits ahead | **$ahead** |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The from-source Docker build, which CI no longer does.
  #
  # ci.yml used to prove this on every push, by compiling the whole tree a second
  # time inside the image build -- 71 of its 77 minutes. That step now assembles
  # the image from an already-built staging tree instead, which is the right
  # trade for a per-push job but leaves a real hole: nothing on a topic branch
  # exercises `COPY . /src`, the in-Dockerfile configure, or the in-Dockerfile
  # build any more. Only publish.yml did, and that runs on main and on tags --
  # so a Dockerfile-only regression would not surface until merge.
  #
  # This closes that at a day's latency instead of a push's. It is deliberately
  # the plain thing: no ccache, no staging, no shortcuts, exactly what a release
  # build does.
  docker-from-source:
    name: docker image builds from source
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 120
    steps:
      # recursive, and it has to reach two levels: the server core is the core/
      # submodule (ADR-0020) and the core carries the Eluna engine as a
      # submodule of its own. Without this the build stops at the root
      # CMakeLists' FATAL_ERROR about an empty core/, and with only one level it
      # stops at the core's FATAL_ERROR about a missing Eluna.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same reclaim ci.yml needs, and rewritten for the same reason: those
      # paths exist only on the hosted VM image (so they are guarded rather than
      # assumed), and `docker image prune -af` on a SHARED daemon deletes other
      # tenants' images. See the long note on the equivalent step in ci.yml.
      - name: Free runner disk
        run: |
          df -h .
          for d in /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            if [ -d "$d" ]; then $SUDO rm -rf "$d" && echo "removed $d"; fi
          done
          docker image rm -f twow/core:nightly-from-source 2>/dev/null || true
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f --filter until=24h || true
          df -h .

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image the way a release builds it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: runtime
          push: false
          load: true
          tags: twow/core:nightly-from-source
          # BUILD_JOBS caps ninja inside the image build. Without it the
          # Dockerfile falls back to nproc, which on this pod is 20 concurrent
          # compiles against ~9.2 GiB - the one place in these workflows where
          # the compile is NOT on the runner and so cannot be capped from the
          # workflow side.
          build-args: |
            BUILD_TYPE=Release
            BUILD_JOBS=${{ vars.CI_BUILD_JOBS || '4' }}

      # The failure this is really guarding against is a binary that builds and
      # then cannot start, so check the loader too, not just the file mode.
      - name: Verify the binaries run in the image
        run: |
          docker run --rm --entrypoint /bin/sh twow/core:nightly-from-source -c '
            set -e
            test -x /opt/turtle/bin/mangosd
            test -x /opt/turtle/bin/realmd
            for b in /opt/turtle/bin/mangosd /opt/turtle/bin/realmd; do
              if ldd "$b" | grep "not found"; then
                echo "::error::$b has unresolved shared libraries"
                exit 1
              fi
            done
            echo "both binaries present with every shared library resolved"
          '
