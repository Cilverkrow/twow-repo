# Build once, promote everywhere.
#
# Images are built here and never rebuilt per environment (ADR-0023): a tag and
# a main commit produce the same artifact, and what moves between environments
# is the digest. That is also why provenance and an SBOM are attached at build
# time rather than generated later from a running container.
#
# Tagging: semver on a release tag, commit SHA on main. Nothing here publishes
# `latest` for a main build - a floating tag is how an environment quietly
# changes underneath you.
#
# WHY THIS IS NOT PART OF ci.yml. Everything else that runs per push lives in one
# file now, and this deliberately does not join it. Two reasons, both hard:
# the triggers are narrower (main and release tags only, never a pull request or
# a refactor branch), and the permissions are much broader - packages:write,
# id-token:write, attestations:write. Merging the two would grant those to every
# pull request run, including one from a fork. The trigger list below was audited
# during that consolidation and is already as narrow as it should be.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress: a half-pushed image and its attestations are worse
  # than a duplicated build.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # id-token for the OIDC identity the attestation is signed against, and
  # attestations because actions/attest-build-provenance writes one to the
  # repository's attestation store. Without the second, the first is useless.
  id-token: write
  attestations: write

# WHERE THIS RUNS: GitHub-hosted runners, and only there. The repository is
# public, so hosted minutes are free; the billing block that once moved these
# jobs onto the shared self-hosted pod `k8s-twow-repo` is over, and every
# publish run since has run on a hosted VM (`vars.CI_RUNNER` is unset). The
# variable fallback in the runs-on lines is being replaced by a literal
# `ubuntu-latest` (#486 B1); a self-hosted runner is out of scope (#486,
# owner decision 2026-10-03).
#
# This is the workflow with write credentials, which is why that matters: a
# self-hosted runner would execute with the repository GITHUB_TOKEN's
# packages:write and the workflow's OIDC identity on a machine this project
# does not exclusively own, and a persistent machine can leak or poison what
# the next job signs. A hosted ephemeral VM cannot. Deploys verify that with
# `gh attestation verify ... --deny-self-hosted-runners`.
env:
  REGISTRY: ghcr.io
  OWNER: cilverkrow

jobs:
  # Two things in this repository are still being written (deploy/compose,
  # deploy/helm/twow). Rather than fail on their absence, the pipeline discovers
  # what exists and publishes that - and says in the log what it skipped.
  discover:
    runs-on: ubuntu-latest
    name: what is publishable
    outputs:
      db_init: ${{ steps.check.outputs.db_init }}
      helm: ${{ steps.check.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        run: |
          set -eu
          # db-init has no Dockerfile of its own: in compose it is mariadb:11.8
          # with db-init.sh and the SQL tree bind-mounted in. That is right for
          # a local stack and wrong for Kubernetes, where a pre-upgrade Job has
          # nothing to bind-mount from - hence a real image. Either input works.
          if [ -f deploy/docker/Dockerfile.db-init ] || [ -f deploy/compose/db-init.sh ]; then
            echo "db_init=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_init=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Dockerfile.db-init and no db-init.sh - skipping the db-init image"
          fi
          if [ -d deploy/helm/twow ]; then
            echo "helm=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no deploy/helm/twow - skipping the chart"
          fi

  # mangosd and realmd come out of the same Dockerfile: Dockerfile.core installs
  # both binaries into one runtime image, and the entrypoint decides which runs.
  # They are published under two names anyway, because the Helm chart and the
  # compose file address them separately and an image name is part of that
  # contract. The second build is a cache hit, not a second compile.
  core:
    needs: discover
    runs-on: ubuntu-latest
    name: core images (mangosd, realmd)
    # No matrix. mangosd and realmd were built as two matrix entries from the
    # SAME Dockerfile and the SAME `--target runtime`, differing only in the tag
    # pushed - and that target does `COPY --from=builder ${PREFIX} ${PREFIX}`,
    # so one image already contains both binaries (ci.yml:1690 verifies exactly
    # that). It was the same build twice: 69 min + 78 min on 2026-09-05.
    # One build now, pushed under both names.
    steps:
      # recursive reaches two levels: core/ (ADR-0020) and the Eluna submodule
      # inside it. Anything less and the Dockerfile's `COPY . /src` copies an
      # empty core/ and the build stops at a CMake FATAL_ERROR.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow, exactly like ci.yml's build-and-test (#486 B4). The
          # revision header the build stamps needs only the core submodule's
          # HEAD: `git rev-parse --short=20 HEAD` and `git show -s --format=%ci`
          # read that one commit, so history does not change it. Measured
          # before the switch, with fetch-depth 0 here and 1 in ci.yml, for core
          # 441d62e7: both configured "Core revision: 441d62e771be7269d580
          # 2026-10-02 19:13:36 +0200" (runs 37044803023 and 37044803296).
          # Full history only made the `COPY . /src` context larger.
          fetch-depth: 1

      # The self-hosted runner is a shared pod with ~28 GB free, not a fresh VM
      # with 70. A from-source build of this tree plus two published images does
      # not fit next to whatever the last job left behind. Only this pipeline's
      # own leftovers and dangling layers are removed - `docker image prune -af`
      # would take other tenants' images with it.
      - name: Reclaim disk
        run: |
          df -h .
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f --filter until=24h || true
          df -h .

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The core commit inside this image: the gitlink of core/ in the commit
      # being published. Until now it was only implied by that gitlink and by
      # the revision string compiled into the binary; it goes into an OCI label,
      # the job summary and publish-digest.json below.
      - name: Record the core revision
        id: core-revision
        run: |
          set -eu
          core_sha=$(git ls-tree HEAD core | awk '$2 == "commit" { print $3 }')
          printf '%s' "$core_sha" | grep -Eqx '[0-9a-f]{40}' || {
            echo "::error::could not read the core gitlink from HEAD"
            exit 1
          }
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/mangosd
            ${{ env.REGISTRY }}/${{ env.OWNER }}/realmd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Added to metadata-action's own OCI labels (created, revision,
          # source, version, ...). ci.yml puts the same label on the image it
          # assembles, so a promotion (#486 B5) can compare the two.
          labels: |
            io.twow.core.revision=${{ steps.core-revision.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TW_ARCH stays at the Dockerfile default (x86-64-v2). `native` would
          # bake this runner's CPU into a published image (ADR-0028).
          #
          # BUILD_JOBS caps ninja INSIDE the image build. This is the one
          # compile in these workflows that does not happen on the runner, so it
          # cannot be capped from the workflow side any other way. The
          # Dockerfile no longer falls back to nproc - an uncapped -j20 against
          # the pod's ~9.2 GiB is what killed buildkitd after 139 of 1472
          # targets - but the cap is still passed from here so CI sets it in one
          # place. See the env block at the top of ci.yml.
          build-args: |
            BUILD_TYPE=Release
            BUILD_JOBS=${{ vars.CI_BUILD_JOBS || '4' }}
          # Attached to the image in the registry: provenance mode=max records
          # the full build definition, sbom records what is inside it. Both are
          # part of the artifact, so a promoted digest carries them along.
          provenance: mode=max
          sbom: true
          # NO Actions (type=gha) cache for this image, deliberately (#486 B3).
          # It used to read and write `type=gha,scope=core,mode=min`, and that
          # could never hit: mode=min stores only the final layers, the payload
          # layer changes on every build, and the compile happens behind a
          # BuildKit cache mount (`--mount=type=cache,target=/ccache`) that
          # type=gha does not export and that starts empty on every hosted VM.
          # Measured in run 37044803023: all 1,507 targets compiled cold
          # (3504.7 s), and the export then spent 110 s writing a ~950 MB blob
          # that only evicted useful entries from the repository's 10 GB cache.
          # (Before that, mode=max across two matrix scopes filled ~7 GB and
          # evicted ci.yml's ccache, so `build + test` ran cold for weeks.)
          # The way to stop compiling twice is to promote the image ci.yml
          # already built (#486 B5), not to cache this build.

      # The DWARF that split-debug.sh moved out of the pushed binaries (owner
      # decision 2b): exported from Dockerfile.core's FROM-scratch
      # `debug-symbols` stage into a directory on the runner and uploaded as an
      # artifact - never pushed, never a layer of the runtime image.
      #
      # Same builder, same context, same build-args as the `build` step, so the
      # builder stage is a cache hit inside this job's buildx builder and
      # nothing compiles a second time. That holds ONLY while nothing has
      # written into the checkout (the build context `.`) since `build`: any
      # new file there changes the builder stage's `COPY . /src`, BuildKit
      # rebuilds it, and the relink (revision header with a fresh __DATE__/
      # __TIME__) yields binaries whose build ids no longer match the pushed
      # ones. So this step and its upload come DIRECTLY after `build`, the
      # digest record below is written under $RUNNER_TEMP, and the next step
      # compares the build ids with the pushed image instead of trusting the
      # cache.
      - name: Export the split debug symbols
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          target: debug-symbols
          push: false
          outputs: type=local,dest=debug-symbols
          provenance: false
          sbom: false
          build-args: |
            BUILD_TYPE=Release
            BUILD_JOBS=${{ vars.CI_BUILD_JOBS || '4' }}

      # The symbols are only useful if they belong to the binaries that were
      # pushed: every GNU build id in BUILD-IDS must equal the one readelf
      # reads from the same file in the pushed image (by digest, not tag).
      # A mismatch means the export was a second build - fail the run rather
      # than leave symbols gdb would reject looking valid.
      - name: Check the debug symbols match the pushed binaries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/pushed-tree"
          rm -rf "$tree"
          mkdir -p "$tree"
          cid=$(docker create "$REGISTRY/$OWNER/mangosd@$DIGEST" /bin/true)
          docker cp "$cid:/opt/turtle" "$tree/opt-turtle"
          docker rm "$cid" >/dev/null
          manifest=debug-symbols/BUILD-IDS
          [ -s "$manifest" ] || { echo "::error::$manifest is missing or empty"; exit 1; }
          bad=0
          while read -r want rel; do
            [ -n "$rel" ] || continue
            have=$(readelf -n "$tree/opt-turtle/$rel" 2>/dev/null \
              | awk '/Build ID:/ { print $3; exit }')
            if [ "${have:-none}" != "$want" ]; then
              echo "::error::$rel: symbols for build id $want, pushed binary has ${have:-none}"
              bad=$((bad + 1))
            fi
          done < "$manifest"
          [ "$bad" -eq 0 ] || exit 1
          echo "build ids match for $(wc -l < "$manifest") file(s)"

      # Retained for 90 days: the symbols are needed for as long as an image
      # built here might still be running or be rolled back to.
      - name: Upload the split debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: debug-symbols/
          retention-days: 90
          if-no-files-found: error

      # The build step's registry attestation is buildkit's. This one is signed
      # against the workflow's OIDC identity and lands in the repository's
      # attestation store, which is what `gh attestation verify` checks. They answer
      # different questions and both are wanted.
      # One digest, two names, so one attestation per name. Both must be
      # attested: `gh attestation verify` resolves by the name the user pulled,
      # and attesting only one would leave the other unverifiable even though it
      # is byte-identical.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/mangosd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/realmd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # What a deploy pins, written down where a deploy can read it (#486 B3,
      # owner decision 4): the digest comes from here or from the attestation
      # subject, NEVER from resolving a tag - anyone who can push can move a
      # tag. Written only after both attestations succeeded, so a
      # publish-digest.json always names an attested digest.
      #
      # Schema: {repo_sha, core_sha, image, digest, workflow, run_id, built_at}.
      # `image` is the mangosd name; `images` adds every name the same digest
      # was pushed and attested under (realmd is byte-identical, see above).
      # `workflow` is github.workflow_ref, i.e. the signer a deploy passes to
      # `gh attestation verify --signer-workflow`.
      #
      # Written under $RUNNER_TEMP, never into the checkout: the checkout is
      # the build context `.` (see the debug-symbols export above), and
      # .dockerignore also excludes publish-digest/ in case that ever changes.
      - name: Record the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CORE_SHA: ${{ steps.core-revision.outputs.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' || {
            echo "::error::build step returned no image digest"
            exit 1
          }
          out="$RUNNER_TEMP/publish-digest"
          mkdir -p "$out"
          jq -n \
            --arg repo_sha "$GITHUB_SHA" \
            --arg core_sha "$CORE_SHA" \
            --arg image "$REGISTRY/$OWNER/mangosd" \
            --arg realmd "$REGISTRY/$OWNER/realmd" \
            --arg digest "$DIGEST" \
            --arg workflow "$WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repo_sha: $repo_sha, core_sha: $core_sha, image: $image,
              digest: $digest, workflow: $workflow, run_id: $run_id,
              built_at: $built_at, images: [$image, $realmd]}' \
            > "$out/publish-digest.json"
          cat "$out/publish-digest.json"
          {
            echo '## Published core image'
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Names: \`$REGISTRY/$OWNER/mangosd\`, \`$REGISTRY/$OWNER/realmd\`"
            echo "- Repo commit: \`$GITHUB_SHA\` (\`$GITHUB_REF\`)"
            echo "- Core commit: \`$CORE_SHA\`"
            echo "- Signer workflow: \`$WORKFLOW_REF\`"
            echo
            # Owner decision 4 fixes the deploy rule to builds of main. The
            # command below is that rule, literally - never $GITHUB_REF, which
            # for a tag or a dispatch from a branch would print a command that
            # passes for an image the rule must reject.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "**Not deployable under #486 decision 4:** built from \`$GITHUB_REF\`, not refs/heads/main."
              echo "The verification below fails for this digest, as it should."
              echo
            fi
            echo "Pin by digest only. Verify first:"
            echo
            echo '```'
            echo "gh attestation verify oci://$REGISTRY/$OWNER/mangosd@$DIGEST \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/publish.yml \\"
            echo "  --source-ref refs/heads/main --deny-self-hosted-runners"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publish-digest.json
        uses: actions/upload-artifact@v4
        with:
          name: publish-digest
          path: ${{ runner.temp }}/publish-digest/publish-digest.json
          if-no-files-found: error

  db-init:
    needs: discover
    if: needs.discover.outputs.db_init == 'true'
    runs-on: ubuntu-latest
    name: db-init
    steps:
      # Recursive: the SQL this image ships is core/sql, in the submodule. A
      # non-recursive checkout leaves core/ empty and the COPY below silently
      # produces an image with no schema in it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # When the repository grows a real deploy/docker/Dockerfile.db-init this
      # step does nothing and that file is used. Until then the image is
      # assembled here from the pieces compose already bind-mounts, so the same
      # script runs in both places rather than diverging into two bootstraps.
      #
      # core/sql/base is ~130 MB and goes into the image on purpose: an init Job in
      # Kubernetes has no host directory to read it from, and the alternative is
      # a second volume to provision before the first install can run.
      - id: dockerfile
        run: |
          set -eu
          if [ -f deploy/docker/Dockerfile.db-init ]; then
            echo "path=deploy/docker/Dockerfile.db-init" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .ci
          cat > .ci/Dockerfile.db-init <<'EOF'
          FROM mariadb:11.8
          # Paths match the bind mounts in deploy/compose/docker-compose.yml,
          # except where one tree serves several of them - see the ENV below.
          COPY deploy/compose/db-init.sh /db-init.sh
          COPY core/sql /sql
          COPY core/modules/mod-playerbots/sql /sql-playerbots
          # The platform's overlay on that schema (ADR-0040): the index, the
          # cv_bots migration, and the maintenance scripts rewritten for the
          # cv_bots database. db-init applies it after the core's files.
          COPY deploy/sql/playerbots /sql-playerbots-overlay
          # mod-bot-brain's cv_brain schema (ADR-0039). db-init skips the stage when
          # this path is absent, so the image stays correct either way - but the
          # published one should carry it, or a compose deployment gets a brain with
          # no schema and the first mint fails at runtime instead of at bootstrap.
          COPY modules/mod-bot-brain/sql /sql-bot-brain
          # Core #97 removed its duplicate of this login schema; the module is
          # now the only source db-init may apply.
          COPY modules/mod-donation/data/sql /sql-donation
          # One tree, three names. db-init.sh reads the platform migration
          # stream, the pinned core's stream and the world base from three
          # separate variables; in this image all three are core/sql. It
          # REQUIRES the core one -- it exits on a missing
          # $CORE_SQL_DIR/create_databases.sql -- and no /sql-core was ever
          # copied here, so this image could not complete a bootstrap at all.
          #
          # Environment rather than two more COPYs: core/sql/base is ~130 MB and
          # copying it under a second and third name triples the image for no
          # content. Symlinks are not an option either -- stage 20 runs
          # `find "$SQL_BASE_DIR"`, and find does not descend into a symlinked
          # directory given as its starting point.
          ENV CORE_SQL_DIR=/sql SQL_BASE_DIR=/sql/base
          RUN chmod +x /db-init.sh
          VOLUME ["/state"]
          ENTRYPOINT ["/bin/bash", "/db-init.sh"]
          EOF
          # The repository's .dockerignore excludes core/sql/ - correct for
          # Dockerfile.core, which does not want 130 MB it never reads, and
          # fatal here. BuildKit prefers <dockerfile>.dockerignore when it
          # exists, so this image gets its own without touching the shared one.
          cat > .ci/Dockerfile.db-init.dockerignore <<'EOF'
          .git
          runbooks/
          docs/
          patches/
          ops/
          **/build/
          **/CMakeCache.txt
          **/CMakeFiles/
          *.log
          EOF
          echo "path=.ci/Dockerfile.db-init" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/db-init
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=db-init
          cache-to: type=gha,mode=max,scope=db-init

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/db-init
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The chart is published as an OCI artifact to the same registry as the
  # images, so one credential and one promotion path covers both.
  helm:
    needs: discover
    if: needs.discover.outputs.helm == 'true'
    runs-on: ubuntu-latest
    name: helm chart
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: azure/setup-helm@v4

      # Lint before packaging: a chart that does not template is not worth a
      # version number.
      - name: Lint and template
        run: |
          helm lint deploy/helm/twow
          helm template twow deploy/helm/twow > /dev/null

      # Helm's OCI registry requires a semver version, so a main build gets a
      # prerelease suffix rather than reusing the chart's release version. That
      # keeps `main` installable for testing without it ever outranking a real
      # release in a version constraint.
      - id: version
        run: |
          set -eu
          base=$(helm show chart deploy/helm/twow | sed -n 's/^version: *//p' | head -n1)
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *)            version="${base}-main.${GITHUB_SHA:0:12}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chart version: $version"

      - name: Package and push
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/twow \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          helm push "dist/twow-${{ steps.version.outputs.version }}.tgz" \
            "oci://$REGISTRY/$OWNER/charts"
